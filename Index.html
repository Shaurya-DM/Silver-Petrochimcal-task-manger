                  Set a rule once — the task is created for the employee automatically every day, week, month or year.
                </p>
              </div>
              <div className="flex gap-2">
                <button className="ghost" disabled={running} onClick={runNow} title="Creates today's tasks right now. Safe to press twice — no duplicates.">
                  {running ? "Running…" : "▶ Create today's tasks now"}
                </button>
                <button className="btn" onClick={openNew}>+ New repeat rule</button>
              </div>
            </div>
            <section className="glass overflow-x-auto">
              <table className="w-full min-w-[900px]">
                <thead>
                  <tr>
                    <th>Task</th>
                    <th>Employee</th>
                    <th>Repeats</th>
                    <th>Due after</th>
                    <th>Next dates</th>
                    <th>Status</th>
                    <th />
                  </tr>
                </thead>
                <tbody>
                  {ld && !rules.length && (<tr><td colSpan="7" className="text-center mute py-8">Loading…</td></tr>)}
                  {!ld && !rules.length && (
                    <tr><td colSpan="7" className="text-center mute py-8">No repeat rules yet. Click “New repeat rule”.</td></tr>
                  )}
                  {rules.map((r) => (
                    <tr key={r.id} className="rowt hov" style={r.active ? null : { opacity: 0.55 }}>
                      <td>
                        <div className="font-semibold">{r.taskName}</div>
                        <div className="text-xs mute max-w-[240px]">{r.description}</div>
                      </td>
                      <td><span className="px-2 py-0.5 rounded-full text-[11px] font-bold soft2">{r.person}</span></td>
                      <td className="text-sm">{repDesc(r)}<div className="text-[11px] mute">from {isoToDmy(r.startDate)}{r.endDate ? " to " + isoToDmy(r.endDate) : ""}</div></td>
                      <td className="text-sm">{r.dueInDays ? r.dueInDays + " day" + (r.dueInDays > 1 ? "s" : "") : "same day"}</td>
                      <td className="font-mono text-xs">{(r.next || []).map(isoToDmy).join("  ·  ") || "—"}</td>
                      <td>
                        <span className="px-2 py-0.5 rounded-full text-[11px] font-bold soft2" style={{ color: r.active ? "var(--teal)" : "var(--text2)" }}>
                          {r.active ? "Active" : "Paused"}
                        </span>
                      </td>
                      <td className="whitespace-nowrap text-xs font-semibold">
                        <button className="c-link" onClick={() => openEdit(r)}>Edit</button>{" "}
                        <button className="ghost" onClick={() => toggle(r)}>{r.active ? "Pause" : "Resume"}</button>{" "}
                        <button className="c-rose" onClick={() => del(r)}>Delete</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </section>
            <p className="text-xs mute">
              Tasks are created every morning around 7 AM (after you run <b>createDailyTaskEngineTrigger</b> once in Apps Script). Follow-up dates and the
              Monday “stale tasks” digest run from the same daily job.
            </p>
            {f && (
              <Modal
                title={f.id ? "Edit repeat rule" : "New repeat rule"}
                onClose={() => setF(null)}
                foot={
                  <>
                    <button className="ghost" onClick={() => setF(null)}>Cancel</button>
                    <button className="btn" disabled={sub} onClick={save}>{sub ? "Saving…" : "Save rule"}</button>
                  </>
                }
              >
                <Field l="Task name *"><input value={f.taskName} onChange={set("taskName")} placeholder="e.g. All party account tally" /></Field>
                <div className="grid grid-cols-2 gap-3">
                  <Field l="For employee *">
                    <select value={f.personKey} onChange={set("personKey")}>
                      {people.map((p) => (<option key={p.key} value={p.key}>{p.name}</option>))}
                    </select>
                  </Field>
                  <Field l="Priority">
                    <select value={f.priority} onChange={set("priority")}><option>High</option><option>Medium</option><option>Low</option></select>
                  </Field>
                </div>
                <Field l="Description"><textarea rows="2" value={f.description} onChange={set("description")} /></Field>
                <div className="grid grid-cols-2 gap-3">
                  <Field l="Repeats">
                    <select value={f.repeat} onChange={set("repeat")}>
                      <option value="Daily">Every day</option>
                      <option value="Weekdays">Mon to Sat</option>
                      <option value="Weekly">Every week</option>
                      <option value="Monthly">Every month</option>
                      <option value="Yearly">Every year</option>

                  {f.repeat === "Weekly" && (
                    <Field l="On">
                      <select value={f.wDay} onChange={set("wDay")}>{REP_DOW.map((d) => (<option key={d}>{d}</option>))}</select>
                    </Field>

                  {f.repeat === "Monthly" && (
                    <Field l="On day">
                      <select value={f.mDay} onChange={set("mDay")}>
                        {Array.from({ length: 31 }, (_, i) => String(i + 1)).map((d) => (<option key={d}>{d}</option>))}

                  )}
                  {f.repeat === "Yearly" && (
                    <Field l="On">

                        </select>
                        <select value={f.yDay} onChange={(e) => setF({ ...f, yDay: +e.target.value })}>
                          {Array.from({ length: 31 }, (_, i) => i + 1).map((d) => (<option key={d}>{d}</option>))}
                        </select>
                      </div>
                    </Field>
                  )}
                </div>
                <div className="grid grid-cols-3 gap-3">
                  <Field l="Start date *"><input type="date" value={f.startDate} onChange={set("startDate")} /></Field>
                  <Field l="End date (optional)"><input type="date" value={f.endDate} onChange={set("endDate")} /></Field>
                  <Field l="Due after (days)"><input type="number" min="0" max="365" value={f.dueInDays} onChange={set("dueInDays")} /></Field>

      /* ============ AI ASSISTANT (Gemini) ============ */
      function Rich({ text }) {
        const lines = String(text || "").split("\n");
        return (
          <div className="space-y-1">
            {lines.map((ln, i) => {
              const bullet = /^\s*[-*•]\s+/.test(ln);
              const body = ln.replace(/^\s*[-*•]\s+/, "");
              const parts = body.split(/\*\*(.+?)\*\*/g);
              return (
                <div key={i} className={bullet ? "pl-4 relative" : ""} style={ln.trim() ? null : { height: 6 }}>
                  {bullet && <span className="absolute left-1">•</span>}
                  {parts.map((p, j) => (j % 2 ? <b key={j}>{p}</b> : <span key={j}>{p}</span>))}
                </div>
              );
            })}
          </div>
        );
      }
      function AIView({ u, admin, onChanged }) {
        const toast = useContext(Toast);
        const WELCOME = [
          {
            role: "model",
            text: admin
              ? "Namaste! Main aapka AI assistant hu. Mujhse reports maango, tasks ka status poocho, ya bolo: **“Sonu ko kal tak party ledger tally ka task do”** — main task taiyaar karunga, aap Confirm dabaoge."
              : "Namaste! Mujhse apne tasks ke baare me poocho (pending, overdue, kya pehle karna hai).",
          },
        ];
        /* chat history is kept in this browser (per user), so it is still there after you change tab or refresh */
        const hKey = "tm_ai_chat_" + (u.personKey || u.fullName || u.name || "me");
        const [msgs, setMsgs] = useState(() => {
          try {
            const s = JSON.parse(localStorage.getItem(hKey) || "null");
            if (s && Array.isArray(s.m) && s.m.length) {
              const fresh = Date.now() - (s.t || 0) < 30 * 60 * 1000; /* old unconfirmed actions are dropped */
              return s.m.map((x) => ({
                ...x,
                actions: (x.actions || []).map((a) => ((a.status === "pending" || a.status === "running") && !fresh ? { ...a, status: "skipped" } : a)),
              }));
            }
          } catch (e) {}
          return WELCOME;
        });
        const [input, setInput] = useState(""),
          [busy, setBusy] = useState(false),
          [auto, setAuto] = useState(false),
          [sq, setSq] = useState("");
        useEffect(() => {
          try {
            localStorage.setItem(hKey, JSON.stringify({ t: Date.now(), m: msgs.slice(-40) }));
          } catch (e) {}
        }, [msgs]);
        const newChat = () => {
          setMsgs(WELCOME);
          try {
            localStorage.removeItem(hKey);
          } catch (e) {}
        };
        /* instant answers from the server (no Gemini wait): overview, overdue, stale, who-does-what, MIS, search */
        const quick = (label, kind, q) => {
          if (busy) return;
          setMsgs((m) => [...m, { role: "user", text: label }]);
          setBusy(true);
          api("aiQuick", u.token, kind, q || "")
            .then((r) => setMsgs((m) => [...m, { role: "model", text: r.reply || "…", ms: r.ms }]))
            .catch((e) => setMsgs((m) => [...m, { role: "model", text: "⚠️ " + (e.message || e), err: true }]))
            .finally(() => setBusy(false));
        };
        const doSearch = () => {
          const t = sq.trim();
          if (!t) return;
          quick("🔎 " + t, "find", t);
          setSq("");
        };
        const box = useRef(null);
        useEffect(() => {
          if (box.current) box.current.scrollTop = box.current.scrollHeight;
        }, [msgs, busy]);
        const chips = admin
          ? [
              ["📊 Overview report", "q:overview"],
              ["⏰ Overdue report", "q:overdue"],
              ["🏆 MIS report", "q:mis"],
              ["💤 Stale tasks", "q:stale"],
              ["👥 Kaun kya kar raha hai", "q:whodoes"],
              ["➕ Task assign", "Assign task: "],
            ]
          : [
              ["📋 Mere pending", "q:whodoes"],
              ["⏰ Meri overdue", "q:overdue"],
              ["🎯 Priority", "Mujhe sabse pehle kya karna chahiye?"],
            ];
        const send = (text) => {
          const t = (text != null ? text : input).trim();
          if (!t || busy) return;
          const next = [...msgs, { role: "user", text: t }];
          setMsgs(next);
          setInput("");
          setBusy(true);
          api("aiChat", u.token, next.map((m) => ({ role: m.role, text: m.text })), admin && auto)
            .then((r) => {
              setMsgs((m) => [...m, { role: "model", text: r.reply || "…", actions: r.actions || [], ms: r.ms }]);
              if ((r.actions || []).some((a) => a.status === "done")) onChanged && onChanged();
            })
            .catch((e) => setMsgs((m) => [...m, { role: "model", text: "⚠️ " + (e.message || e), err: true }]))
            .finally(() => setBusy(false));
        };
        const setAct = (mi, id, patch) =>
          setMsgs((m) => m.map((x, i) => (i !== mi ? x : { ...x, actions: x.actions.map((a) => (a.id === id ? { ...a, ...patch } : a)) })));
        const run = (mi, a) => {
          setAct(mi, a.id, { status: "running" });
          return api("aiRunAction", u.token, { tool: a.tool, args: a.args })
            .then((r) => {
              setAct(mi, a.id, { status: r.success ? "done" : "failed", message: r.message });
              if (r.success) { toast(r.message); onChanged && onChanged(); } else toast(r.message, 1);
            })
            .catch((e) => setAct(mi, a.id, { status: "failed", message: e.message || String(e) }));
        };
        const runAll = async (mi) => {
          for (const a of msgs[mi].actions.filter((x) => x.status === "pending")) await run(mi, a);
        };
        return (
          <div className="space-y-4 max-w-3xl mx-auto">
            <div className="flex flex-wrap justify-between items-end gap-3">
              <div>
                <h1 className="font-display font-extrabold text-2xl">✨ AI Assistant</h1>
                <p className="text-sm sub">
                  {admin ? "Reports banao, tasks poochho, tasks assign karo — Gemini AI se." : "Apne tasks ke baare me poochho."}
                </p>
              </div>
              <button type="button" className="ghost text-xs" onClick={newChat} title="Purani chat saaf karke nayi shuru karo">🗑️ New chat</button>
              {admin && (
                <label className="flex items-center gap-2 text-xs cursor-pointer" title="ON: AI tasks seedha bana dega, bina Confirm dabaye.">
                  <input type="checkbox" checked={auto} onChange={(e) => setAuto(e.target.checked)} style={{ width: 15, height: 15, accentColor: "var(--accent)" }} />
                  <span className="sub font-semibold">Auto-run (bina Confirm ke)</span>
                </label>
              )}
            </div>
            <section className="glass p-3 sm:p-4 flex flex-col" style={{ minHeight: 420 }}>
              <div ref={box} className="flex-1 overflow-y-auto space-y-3 pr-1" style={{ maxHeight: "58vh" }}>
                {msgs.map((m, mi) => (
                  <div key={mi} className={"flex " + (m.role === "user" ? "justify-end" : "justify-start")}>
                    <div
                      className={"rounded-2xl px-3.5 py-2.5 text-sm max-w-[92%] " + (m.role === "user" ? "text-white" : "soft")}
                      style={m.role === "user" ? { background: "var(--accent)" } : m.err ? { color: "var(--rose)" } : null}
                    >
                      <Rich text={m.text} />
                      {m.ms ? <div className="text-[10px] mute mt-1">⚡ {(m.ms / 1000).toFixed(1)}s</div> : null}
                      {(m.actions || []).length > 0 && (
                        <div className="mt-2.5 space-y-2">
                          {m.actions.map((a) => (
                            <div key={a.id} className="rounded-xl bd p-2.5" style={{ background: "var(--modal)" }}>
                              <div className="text-xs font-semibold">{a.summary}</div>
                              {a.status === "pending" && (
                                <div className="flex gap-2 mt-2">
                                  <button className="btn !py-1 !px-3 text-xs" onClick={() => run(mi, a)}>✓ Confirm</button>
                                  <button className="ghost text-xs" onClick={() => setAct(mi, a.id, { status: "skipped" })}>Skip</button>
                                </div>
                              )}
                              {a.status === "running" && <div className="text-xs mute mt-1 animate-pulse">Working…</div>}
                              {a.status === "done" && <div className="text-xs c-teal font-semibold mt-1">✅ {a.message || "Done"}</div>}
                              {a.status === "failed" && <div className="text-xs c-rose font-semibold mt-1">❌ {a.message}</div>}
                              {a.status === "skipped" && <div className="text-xs mute mt-1">Skipped</div>}
                            </div>
                          ))}
                          {m.actions.filter((a) => a.status === "pending").length > 1 && (
                            <button className="btn !py-1 !px-3 text-xs" onClick={() => runAll(mi)}>
                              ✓ Confirm all ({m.actions.filter((a) => a.status === "pending").length})
                            </button>
                          )}
                        </div>
                      )}
                    </div>
                  </div>
                ))}
                {busy && (
                  <div className="flex justify-start">
                    <div className="soft rounded-2xl px-3.5 py-2.5 text-sm mute animate-pulse">AI soch raha hai…</div>
                  </div>
                )}
              </div>
              <div className="flex gap-2 mt-3">
                <input
                  className="flex-1"
                  value={sq}
                  onChange={(e) => setSq(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); doSearch(); } }}
                  placeholder={admin ? "🔎 Search: kaun kya kaam kar raha hai? (naam, party, product — jaise: ledger, Mukesh, Kandla)" : "🔎 Search apne tasks me…"}
                />
                <button type="button" className="ghost text-xs" disabled={busy || !sq.trim()} onClick={doSearch}>Search</button>
              </div>
              <div className="flex flex-wrap gap-1.5 mt-3">
                {chips.map(([l, q]) => (
                  <button
                    key={l}
                    type="button"
                    className="ghost text-xs"
                    disabled={busy}
                    onClick={() => (q.startsWith("q:") ? quick(l, q.slice(2)) : q.endsWith(": ") ? setInput(q) : send(q))}
                  >
                    {l}
                  </button>
                ))}
              </div>
              <div className="flex gap-2 mt-2">
                <textarea
                  rows="2"
                  className="flex-1"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
                  placeholder={admin ? "Jaise: Mukesh ko 5 Nov tak all party tally ka task do, High priority" : "Apna sawal likho…"}
                />
                <button className="btn self-end" disabled={busy || !input.trim()} onClick={() => send()}>Send</button>
              </div>
              <p className="text-[11px] mute mt-2">
                AI galti kar sakta hai — tasks assign karne se pehle summary dekh kar Confirm dabao. Employees AI se kuch badal nahi sakte.
              </p>
            </section>
          </div>
        );
      }

      function Bar({ v }) {
        return (
          <div>
            <div className="h-2 rounded-full soft2 overflow-hidden">
              <div
                className="grow h-full rounded-full"
                style={{ width: (v || 0) + "%", background: (v || 0) >= 100 ? "linear-gradient(90deg,#34d399,#10b981)" : (v || 0) < 30 ? "linear-gradient(90deg,#ffd166,#ff8a1f)" : "linear-gradient(90deg,#22d3ee,#3b82f6)" }}
              />
            </div>
            <div className="text-[11px] mute font-mono mt-1">{v || 0}%</div>
          </div>
        );
      }
      /* ============ WHATSAPP REMINDER PICKER (inside "New task") ============ */
      const REM_DEFAULT = { remOn: true, before: [1], onDay: true, overdueDays: 2, times: ["09:00", "16:00"], notifyAdmin: true };
      const remCount = (f) =>
        !f.remOn ? 0 : ((f.before || []).length + (f.onDay ? 1 : 0) + (+f.overdueDays || 0)) * (f.times || []).length;
      function ReminderPicker({ form, setForm }) {
        const set = (p) => setForm({ ...form, ...p });
        const before = form.before || [],
          times = form.times || [];
        const chip = (on) => "px-2.5 py-1 rounded-lg text-xs font-semibold " + (on ? "seg-on" : "ghost");
        const toggleBefore = (n) =>
          set({ before: before.includes(n) ? before.filter((x) => x !== n) : [...before, n].sort((a, b) => b - a) });
        const total = remCount(form);
        return (
          <div className="rounded-xl bd soft p-3 space-y-3">
            <label className="flex items-center justify-between gap-2 cursor-pointer">
              <span className="text-sm font-bold">📲 WhatsApp reminders</span>
              <input
                type="checkbox"
                checked={!!form.remOn}
                onChange={(e) => set({ remOn: e.target.checked })}
                style={{ width: 18, height: 18, accentColor: "var(--accent)" }}
              />
            </label>
            {form.remOn && (
              <>
                <div>
                  <div className="text-[11px] font-semibold mute mb-1.5">Which days?</div>
                  <div className="flex flex-wrap gap-1.5">
                    {[3, 2, 1].map((n) => (
                      <button key={n} type="button" className={chip(before.includes(n))} onClick={() => toggleBefore(n)}>
                        {n} day{n > 1 ? "s" : ""} before
                      </button>
                    ))}
                    <button type="button" className={chip(!!form.onDay)} onClick={() => set({ onDay: !form.onDay })}>
                      On deadline day
                    </button>
                  </div>
                  <div className="flex items-center gap-2 mt-2 text-xs">
                    <span className="font-semibold mute">After deadline (overdue), remind for</span>
                    <select
                      value={form.overdueDays}
                      onChange={(e) => set({ overdueDays: +e.target.value })}
                      style={{ width: 76, padding: "4px 8px" }}
                    >
                      {[0, 1, 2, 3, 4, 5, 7, 10, 14].map((n) => (
                        <option key={n} value={n}>
                          {n === 0 ? "No" : n}
                        </option>
                      ))}
                    </select>
                    <span className="mute">day{form.overdueDays === 1 ? "" : "s"}</span>
                  </div>
                </div>
                <div>
                  <div className="text-[11px] font-semibold mute mb-1.5">At what time? (max 4 times a day)</div>
                  <div className="flex flex-wrap gap-2 items-center">
                    {times.map((t, i) => (
                      <span key={i} className="flex items-center gap-1">
                        <input
                          type="time"
                          value={t}
                          onChange={(e) => set({ times: times.map((x, j) => (j === i ? e.target.value : x)) })}
                          style={{ width: 118, padding: "5px 8px" }}
                        />
                        {times.length > 1 && (
                          <button type="button" className="c-rose text-xs font-bold" onClick={() => set({ times: times.filter((_, j) => j !== i) })}>
                            ✕
                          </button>
                        )}
                      </span>
                    ))}

      /* ============ BELL + CHAT ============ */
      function Bell({ u }) {
        const [l, setL] = useState([]),
          [o, setO] = useState(false),
          [ring, setRing] = useState(false),
          prev = useRef(null),
          seen = useRef(new Set());
        useEffect(() => {
          const f = () =>
            document.hidden ? Promise.resolve() : api("getMyNotifications", u.token)
              .then((r) => {
                const n = (r && r.notifications) || [];
                n.forEach((x) => {
                  if (seen.current.has(x.id)) return;
                  seen.current.add(x.id);
                  if (
                    prev.current !== null &&
                    !x.read &&
                    "Notification" in window &&
                    Notification.permission === "granted"
                  ) {
                    try {
                      const pp = new Notification(x.title || "Task Manager", { body: x.message || "" });
                      setTimeout(() => pp.close(), 10000);
                    } catch (e) {}
                  }
                });
                if (prev.current !== null && n.length > prev.current) {
                  setRing(true);
                  setTimeout(() => setRing(false), 700);
                }
                prev.current = n.length;
                setL(n);
              })
              .catch(() => {});
          const d = () =>
            api("checkDueSoonAndNotify", u.token)
              .then(f)
              .catch(() => {});
          f();
          d();
          const a = setInterval(f, 30000),
            b = setInterval(d, 600000);
          return () => {
            clearInterval(a);
            clearInterval(b);
          };
        }, []);
        const un = l.filter((n) => !n.read).length;
        const read = (ids) => {
          if (!ids.length) return;
          setL((x) => x.map((n) => (ids.includes(n.id) ? { ...n, read: true } : n)));
          api("markNotificationsRead", u.token, ids).catch(() => {});
        };
        return (
          <div className="relative">
            <button onClick={() => setO(!o)} className={"ghost relative " + (ring ? "ring" : "")}>
              🔔
              {un > 0 && (
                <span className="pop absolute -top-1.5 -right-1.5 min-w-[16px] h-4 px-1 rounded-full bg-rose-500 text-white text-[9px] font-bold flex items-center justify-center">
                  {un > 9 ? "9+" : un}
                </span>
              )}
            </button>
            {o && (
              <div
                className="glass pop absolute right-0 mt-2 w-80 max-h-96 overflow-y-auto z-40"
                style={{ background: "var(--modal)" }}
              >
                <div className="px-4 py-3 bdb flex justify-between">
                  <b className="text-sm font-display">Notifications</b>
                  {un > 0 && (
                    <button
                      className="text-xs c-link"
                      onClick={() => read(l.filter((n) => !n.read).map((n) => n.id))}
                    >
                      Mark all read
                    </button>
                  )}
                </div>
                {!l.length && <p className="py-8 text-center text-sm mute">No notifications yet.</p>}
                {l.map((n) => (
                  <div
                    key={n.id}
                    onClick={() => !n.read && read([n.id])}
                    className={"px-4 py-3 rowt cursor-pointer hov " + (!n.read ? "unread" : "")}
                  >
                    <p className="text-sm font-semibold">{n.title}</p>
                    <p className="text-xs mute">{n.message}</p>
                    <p className="text-[11px] mute font-mono mt-1">{n.timestamp}</p>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }
      function Chat({ u }) {
        const [o, setO] = useState(false),
          [m, setM] = useState([]),
          [t, setT] = useState(""),
          [un, setUn] = useState(0),
          last = useRef(0),
          sc = useRef(),
          open = useRef(false);
        useEffect(() => {
          open.current = o;
          if (o) setUn(0);
        }, [o]);
        useEffect(() => {
          const f = () =>
            document.hidden ? Promise.resolve() : api("getChatMessages", u.token, last.current)
              .then((r) => {
                const i = (r && r.messages) || [];
                if (i.length) {
                  last.current = r.lastRow;
                  setM((a) => a.filter((x) => !x.pending).concat(i));
                  if (!open.current) setUn((c) => c + i.filter((x) => x.username !== u.username).length);
                }
              })
              .catch(() => {});
          f();
          const h = setInterval(f, o ? 3000 : 20000);
          return () => clearInterval(h);
        }, [o]);
        useEffect(() => {
          if (sc.current) sc.current.scrollTop = sc.current.scrollHeight;
        }, [m, o]);
        const send = () => {
          const s = t.trim();
          if (!s) return;
          setT("");
          setM((a) => [
            ...a,
            {
              row: "p" + Date.now(),
              pending: true,
              username: u.username,
              fullName: u.fullName,
              message: s,
              timestamp: "Sending…",
            },
          ]);
          api("sendChatMessage", u.token, s).catch(() => {
            setM((a) => a.filter((x) => !x.pending));
            setT(s);
          });
        };
        return (
          <div className="fixed bottom-5 left-5 z-40">
            <button
              onClick={() => setO(!o)}
              className="btn !rounded-full w-14 h-14 !p-0 text-xl relative shadow-2xl"
            >
              {o ? "✕" : "💬"}
              {un > 0 && !o && (
                <span className="pop absolute -top-1 -right-1 min-w-[20px] h-5 px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center">
                  {un}
                </span>
              )}
            </button>
            {o && (
              <div
                className="glass pop absolute bottom-[68px] left-0 w-[330px] h-[440px] flex flex-col overflow-hidden"
                style={{ background: "var(--modal)" }}
              >
                <div className="px-4 py-3 bdb flex items-center gap-2">
                  <b className="font-display text-sm">Team chat</b>
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                </div>
                <div ref={sc} className="flex-1 overflow-y-auto p-3 space-y-3">
                  {!m.length && (
                    <p className="text-center text-xs mute mt-16">No messages yet. Say hello.</p>
                  )}
                  {m.map((x) => {
                    const me = x.username === u.username;
                    return (
                      <div key={x.row} className={"flex flex-col " + (me ? "items-end" : "items-start")}>
                        <div className="text-[10px] mute mb-1">
                          {me ? "You" : x.fullName} · {x.timestamp}
                        </div>
                        <div
                          className={
                            "max-w-[80%] px-3 py-2 text-sm break-words " + (x.pending ? "opacity-50 " : "")
                          }
                          style={
                            me
                              ? { background: "var(--grad)", color: "#fff", borderRadius: "16px 16px 4px 16px" }
                              : { background: "var(--soft2)", borderRadius: "16px 16px 16px 4px" }
                          }
                        >
                          {x.message}
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div className="p-3 bdt flex gap-2">
                  <input
                    className="flex-1"
                    value={t}
                    onChange={(e) => setT(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && send()}
                    placeholder="Message the team…"
                  />
                  <button className="btn" disabled={!t.trim()} onClick={send}>
                    Send
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      /* ============ MAIN ============ */
      function Main({ u, out }) {
        const admin = u.role === "Admin" || u.role === "Manager";
        const [tab, setTab] = useState("dash"),
          [people, setPeople] = useState([]),
          [all, setAll] = useState([]),
          [tasks, setTasks] = useState([]),
          [sel, setSel] = useState(null),
          [pend, setPend] = useState([]);
        const [att, setAtt] = useState([]),
          [busy, setBusy] = useState(false),
          [pl, setPl] = useState(false),
          [al, setAl] = useState(false);
        const [q, setQ] = useState(""),
          [fs, setFs] = useState(""),
          [fp, setFp] = useState(""),
          [view, setView] = useState("table"),
          [kf, setKf] = useState(null),
          [modal, setModal] = useState(null),
          [toasts, setToasts] = useState([]),
          [range, setRange] = useState("all");
        const [form, setForm] = useState({}),
          [sub, setSub] = useState(false);
        const [sheets, setSheets] = useState([]),
          [dbg, setDbg] = useState(""),
          [dbgL, setDbgL] = useState(false),
          [picker, setPicker] = useState(false),
          [aq, setAq] = useState(""),
          [showLog, setShowLog] = useState(false),
          [ef, setEf] = useState(""),
          [fc, setFc] = useState(""),
          [apps, setApps] = useState([]),
          [appsL, setAppsL] = useState(false),
          [appsQ, setAppsQ] = useState(""),
          [nb, setNb] = useState("Notification" in window && Notification.permission === "default");
        const [waBusy, setWaBusy] = useState(false);
        const [offToday, setOffToday] = useState([]);
        const toast = useCallback((m, e) => {
          const id = Math.random();
          setToasts((a) => [...a, { id, m, e }]);
          setTimeout(() => setToasts((a) => a.filter((x) => x.id !== id)), 3200);
        }, []);
        const er = (e) => toast(e.message || String(e), 1);
        const sendWa = (t) => {
          toast("Sending WhatsApp…");
          api("sendOverdueWhatsApp", u.token, t.OwnerKey, t.rowNumber)
            .then((r) => toast(r.message, !r.success))
            .catch(er);
        };
        const sendAllWa = () => {
          if (waBusy) return;
          setWaBusy(true);
          setModal(null);
          api("sendAllOverdueWhatsApp", u.token, sel ? sel.key : ef || "")
            .then((r) => toast(r.message, !r.success))
            .catch(er)
            .finally(() => setWaBusy(false));
        };

        const loadAll = (f) => {
          setBusy(true);
          api("getAllTasks", u.token, !!f)
            .then((t) => setAll(t || []))
            .catch(er)
            .finally(() => setBusy(false));
        };
        const loadMine = () => {
          api("getUserSheets", u.token)
            .then((l) => setSheets(l || []))
            .catch(er);
          setBusy(true);
          api("getTasksByPerson", u.token, u.personKey)
            .then((t) => setTasks(t || []))
            .catch(er)
            .finally(() => setBusy(false));
        };
        const loadPend = (force) => {
          setPl(true);
          api("getTodayPendingWork", u.token, force === true)
            .then((p) => setPend(stamp(p)))
            .catch(er)
            .finally(() => setPl(false));
        };
        const loadAtt = () => {
          if (!admin) return;
          setAl(true);
          api("getTodayAttendanceSummary", u.token)
            .then((s) => {
              setAtt((s && s.records) || []);
              setOffToday((s && s.off) || []);
            })
            .catch(er)
            .finally(() => setAl(false));
        };
        const pickSeq = useRef(0);
        const pick = (p, force) => {
          const id = ++pickSeq.current;                 // only the LATEST click may update the screen
          const cur = () => pickSeq.current === id;
          const switching = !sel || sel.key !== p.key;
          setSel(p);
          setTab("dash");
          if (switching) {                              // never show the previous employee's data
            setTasks([]);
            setSheets([]);
            setPend([]);
          }
          setBusy(true);
          setPl(true);
          setTimeout(() => {
            const el = document.getElementById("emp-detail");
            if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
          }, 60);
          // 1) tasks (served from the server cache)
          api("getTasksByPerson", u.token, p.key, !!force)
            .then((t) => cur() && setTasks(t || []))
            .catch((e) => cur() && er(e))
            .finally(() => cur() && setBusy(false));
          // 2) sheet cards (cheap: only reads the SheetLinks tab)
          api("getEmployeeLinks", u.token, p.key)
            .then((d) => cur() && d && d.personalSheets && setSheets(d.personalSheets))
            .catch(() => {});
          // 3) pending work (slow scan, cached and pre-warmed on the server)
          api("getEmployeeFullData", u.token, p.key, true, !!force)
            .then((d) => {
              if (!cur()) return;
              setSheets(d.personalSheets || []);
              setPend(stamp(d.pendingWork));
            })
            .catch((e) => cur() && er(e))
            .finally(() => cur() && setPl(false));
        };
        const back = () => {
          pickSeq.current++;
          setBusy(false);
          setPl(false);
          setSel(null);
          setTasks([]);
          setPend([]);
          setSheets([]);
          setTab("dash");
          loadAll();
        };
        const refresh = () => {
          if (admin) {
            if (sel) pick(sel, true);
            else {
              loadAll(true);
              loadAtt();
            }
          } else {
            loadMine();
            loadPend(true);
          }
        };
        const loadApps = () => {
          if (!admin) return;
          setAppsL(true);
          api("getApps", u.token)
            .then((l) => setApps(l || []))
            .catch(er)
            .finally(() => setAppsL(false));
        };
        const runAllDbg = () => {
          setDbgL(true);
          setDbg("");
          api("debugAllTasksReport", u.token)
            .then((r) => setDbg(JSON.stringify(r, null, 2)))
            .catch((e) => setDbg("Debug failed: " + (e.message || e)))
            .finally(() => setDbgL(false));
        };

        useEffect(() => {
          api("markAttendance", u.token).catch(() => {});      // auto-punch runs in the background, login stays fast
          if (admin) {
            api("getPeopleList", u.token)
              .then((p) => setPeople(p || []))
              .catch(er);
            loadAll();
            loadAtt();
          } else {
            loadMine();
            loadPend();
          }
        }, []);
        useEffect(() => {
          if (tab === "pend" && admin && !sel) loadPend();
          if (tab === "apps") loadApps();
          window.dispatchEvent(new Event("tabsw"));
        }, [tab]);

        const src = admin && !sel ? all : tasks;
        const filtered = useMemo(() => {
          const s = q.trim().toLowerCase();
          return src
            .filter((t) => {
              if (tab === "over" && !isOver(t)) return false;
              if (admin && !sel && ef && t.OwnerKey !== ef) return false;
              if (fc && (catOf(t) || [])[0] !== fc) return false;
              if (fs && t.Status !== fs) return false;
              if (fp && t.Priority !== fp) return false;
              if (kf === "Overdue" && !isOver(t)) return false;
              if (kf && kf !== "Overdue" && (t.Status || "Pending") !== kf) return false;
              return (
                !s ||
                (t.TaskName || "").toLowerCase().includes(s) ||
                (t.AssignedTo || "").toLowerCase().includes(s)
              );
            })
            .sort((a, b) => (b.TimestampRaw || 0) - (a.TimestampRaw || 0));
        }, [src, q, fs, fp, kf, tab, ef, fc]);
        const cnt = (s) => src.filter((t) => (t.Status || "Pending") === s).length,
          over = src.filter(isOver).length,
          total = src.length;
        const segs = [
          { label: "Done", count: cnt("Done") },
          { label: "Pending", count: cnt("Pending") },
          { label: "In Progress", count: cnt("In Progress") },
          { label: "Overdue", count: over },
        ].map((s) => ({ ...s, color: COL[s.label] }));
        const perf = useMemo(() => {
          const wk = Date.now() - (range === "week" ? 7 : range === "month" ? 30 : 1e5) * 864e5;
          return people
            .map((p) => {
              const m = all.filter(
                (t) => t.OwnerKey === p.key && (range === "all" || (t.TimestampRaw || 0) >= wk),
              );
              const d = m.filter((t) => t.Status === "Done").length;
              return { ...p, total: m.length, pct: m.length ? Math.round((d / m.length) * 100) : 0 };
            })
            .sort((a, b) => b.pct - a.pct);
        }, [people, all, range]);
        const norm = (s) =>
          String(s || "")
            .trim()
            .toLowerCase()
            .replace(/[_\s]+/g, " ");
        const cards = people
          .filter((p) => !aq.trim() || p.name.toLowerCase().includes(aq.trim().toLowerCase()))
          .map((p) => {
            const r = att.find((x) => norm(x.name) === norm(p.name));
            const o = !r && offToday.find((x) => norm(x.name) === norm(p.name));
            return {
              ...p,

                            target="_blank"
                            rel="noopener noreferrer"
                            className="glass card pop flex flex-col overflow-hidden"
                            style={{
                              animationDelay: Math.min(i, 11) * 40 + "ms",
                              color: "inherit",
                              textDecoration: "none",
                            }}
                          >
                            <div className="h-1.5" style={{ background: ACC[i % 8] }} />
                            <div className="p-5 flex flex-col gap-3">
                              <div className="w-14 h-14 rounded-2xl flex items-center justify-center text-3xl soft2">
                                {a.icon && a.icon.trim() ? a.icon : "🔗"}
                              </div>
                              <div>
                                <p className="font-bold font-display truncate">{a.name}</p>
                                <p className="text-sm mute mt-1 line-clamp-2">
                                  {a.description || "Click to open this tool"}
                                </p>
                              </div>
                              <div className="pt-3 bdt text-xs font-semibold c-link">Open app →</div>
                            </div>
                          </a>
                        </Tilt>
                      ))}
                    </div>
                  </div>
                )}

                {tab === "pend" && (
                  <Pending
                    items={pend}
                    admin={admin}
                    u={u}
                    loading={pl}
                    reload={admin && sel ? () => pick(sel, true) : () => loadPend(true)}
                  />
                )}

                {showTasks && (
                  <>
                    {tab === "over" && (
                      <div className="flex justify-between items-end">
                        <div>
                          <h1 className="font-display font-extrabold text-2xl">Overdue tasks</h1>
                          <p className="text-sm sub">
                            {admin ? "Past deadline across all employees" : "Your tasks past their deadline"}
                          </p>
                        </div>
                        <div className="flex items-center gap-2">
                          {admin && filtered.length > 0 && (
                            <button className="btn" disabled={waBusy} onClick={() => setModal({ type: "waall", n: filtered.length })}>
                              {waBusy ? "Sending…" : "📲 Send all on WhatsApp"}
                            </button>
                          )}
                          <span className="font-mono font-bold c-rose bgrose rounded-lg px-3 py-1.5 text-sm">
                            {filtered.length} overdue
                          </span>
                        </div>
                      </div>
                    )}
                    <section className="glass p-4 flex flex-wrap gap-3 items-center">
                      <input
                        className="flex-1 min-w-[200px]"
                        value={q}
                        onChange={(e) => setQ(e.target.value)}
                        placeholder="Search tasks…"
                      />
                      {admin && !sel && (
                        <select value={ef} onChange={(e) => setEf(e.target.value)}>
                          <option value="">Employee</option>
                          {people.map((p) => (
                            <option key={p.key} value={p.key}>
                              {p.name}
                            </option>
                          ))}
                        </select>
                      )}
                      <select value={fs} onChange={(e) => setFs(e.target.value)}>
                        <option value="">Status</option>
                        {["Pending", "In Progress", "Done", "Revised"].map((s) => (
                          <option key={s}>{s}</option>
                        ))}
                      </select>
                      <select value={fc} onChange={(e) => setFc(e.target.value)}>
                        <option value="">Category</option>
                        {CATS.map((c) => (
                          <option key={c[0]}>{c[0]}</option>
                        ))}
                      </select>
                      <select value={fp} onChange={(e) => setFp(e.target.value)}>
                        <option value="">Priority</option>
                        <option>High</option>
                        <option>Medium</option>
                        <option>Low</option>
                      </select>
                      <button
                        className="ghost"
                        onClick={() => {
                          setKf(null);
                          setFs("");
                          setFp("");
                          setEf("");
                          setQ("");
                          setFc("");
                        }}
                      >
                        View all tasks
                      </button>
                      <div className="flex ml-auto rounded-lg overflow-hidden" style={{ border: "1px solid var(--ghost-bd)" }}>
                        {["table", "board"].map((v) => (
                          <button
                            key={v}
                            onClick={() => setView(v)}
                            className={"px-3 py-2 text-xs font-semibold capitalize " + (view === v ? "seg-on" : "seg-off")}
                          >
                            {v}
                          </button>
                        ))}
                      </div>
                    </section>
                    {admin && !sel && tab === "tasks" && (
                      <p className="text-xs sub">
                        Showing all employees. Open one from the dashboard to add tasks.
                      </p>
                    )}
                    {busy && (
                      <div className="glass p-8 text-center text-sm mute animate-pulse">Loading tasks…</div>
                    )}
                    {!busy && !filtered.length && (
                      <div className="glass p-14 text-center">
                        <p className="font-semibold">
                          {tab === "over" ? "No overdue tasks." : "No tasks match this view."}
                        </p>
                        <p className="text-xs mute mt-1">
                          Clear a filter{admin && sel ? " or add a task" : ""}.
                        </p>
                        {admin && sel && (
                          <button className="btn mt-4" onClick={openAdd}>
                            + Add a task
                          </button>
                        )}
                      </div>
                    )}
                    {!busy &&
                      filtered.length > 0 &&
                      (view === "table" ? (
                        <Table
                          tasks={filtered}
                          admin={admin}
                          owner={admin && !sel}
                          onEdit={openEdit}
                          onDel={(t) => setModal({ type: "del", t })}
                          onWa={sendWa}
                        />
                      ) : (
                        <Board
                          tasks={filtered}
                          admin={admin}
                          onEdit={openEdit}
                          onDel={(t) => setModal({ type: "del", t })}
                          onMove={move}
                          onWa={sendWa}
                        />
                      ))}
                  </>
                )}
              </main>
            </div>

            <Chat u={u} />

            {modal && modal.type === "add" && (
              <Modal
                title="New task"
                onClose={() => setModal(null)}
                foot={
                  <>
                    <button className="ghost" onClick={() => setModal(null)}>
                      Cancel
                    </button>
                    <button className="btn" disabled={sub} onClick={submitAdd}>
                      {sub ? "Adding…" : "Add task"}
                    </button>
                  </>
                }
              >
                <Field l="Assign to">
                  <div className="px-3 py-2 rounded-lg soft text-sm font-semibold">
                    {admin ? sel && sel.name : u.fullName}
                  </div>
                </Field>
                <Field l="Task name *">
                  <input value={form.taskName} onChange={F("taskName")} placeholder="e.g. Site inspection" />
                </Field>
                <Field l="Assigned to *">
                  <input value={form.assignedTo} onChange={F("assignedTo")} placeholder="Person's name" />
                </Field>
                <Field l="Description *">
                  <textarea rows="3" value={form.description} onChange={F("description")} />
                </Field>
                <div className="grid grid-cols-2 gap-3">
                  <Field l="Deadline *">
                    <input type="date" value={form.deadline} onChange={F("deadline")} />
                  </Field>
                  <Field l="Priority">
                    <select value={form.priority} onChange={F("priority")}>
                      <option>High</option>
                      <option>Medium</option>
                      <option>Low</option>
                    </select>
                  </Field>
                </div>
                <Field l="Follow-up date (optional) — for long tasks you want to be reminded about">
                  <input type="date" value={form.followUp || ""} onChange={F("followUp")} />
                </Field>
                <ReminderPicker form={form} setForm={setForm} />
              </Modal>
            )}
            {modal && modal.type === "edit" && (
              <Modal
                title="Update task"
                onClose={() => setModal(null)}
                foot={
                  <>
                    <button className="ghost" onClick={() => setModal(null)}>
                      Cancel
                    </button>
                    <button className="btn" disabled={sub} onClick={submitEdit}>
                      {sub ? "Saving…" : "Save changes"}
                    </button>
                  </>
                }
              >
                <div className="px-3 py-2 rounded-lg soft text-sm font-semibold">{modal.t.TaskName}</div>
                <Field l="Status">
                  <select value={form.status} onChange={F("status")}>
                    {["Pending", "In Progress", "Done", "Revised"].map((s) => (
                      <option key={s}>{s}</option>
                    ))}
                  </select>
                </Field>
                <Field l={"Progress: " + form.progress + "%"}>
                  <input
                    type="range"
                    min="0"
                    max="100"
                    value={form.progress}
                    onChange={(e) => setForm({ ...form, progress: +e.target.value })}
                    className="!p-0"
                    style={{ accentColor: "var(--accent)" }}
                  />
                </Field>
                <Field l="Remark">
                  <textarea rows="2" value={form.remark} onChange={F("remark")} />
                </Field>
                <Field l="Next follow-up date (clear it if none)">
                  <input type="date" value={form.followUp || ""} onChange={F("followUp")} />
                </Field>
                <Field l="Add a progress note (saved with today's date)">
                  <textarea rows="2" value={form.note || ""} onChange={F("note")} placeholder="e.g. Party said payment next week" />
                </Field>
                {modal.t.Notes && (
                  <div className="rounded-lg soft p-2.5 text-xs whitespace-pre-line max-h-28 overflow-y-auto">
                    <b className="mute">Earlier notes</b>
                    {"\n" + modal.t.Notes}
                  </div>
                )}
              </Modal>
            )}
            {modal && modal.type === "del" && (
              <Modal
                title="Delete this task?"
                onClose={() => setModal(null)}
                foot={
                  <>
                    <button className="ghost" onClick={() => setModal(null)}>
                      Cancel
                    </button>
                    <button className="btn btn-danger" onClick={submitDel}>
                      Delete task
                    </button>
                  </>
                }
              >
                <p className="text-sm sub">{modal.t.TaskName}</p>
              </Modal>
            )}

            {modal && modal.type === "waall" && (
              <Modal
                title="Send overdue alerts on WhatsApp?"
                onClose={() => setModal(null)}
                foot={
                  <>
                    <button className="ghost" onClick={() => setModal(null)}>
                      Cancel
                    </button>
                    <button className="btn" onClick={sendAllWa}>
                      Send now
                    </button>
                  </>
                }
              >
                <p className="text-sm sub">
                  This sends one WhatsApp message per overdue task to the employee and to the admin number
                  {sel ? " for " + sel.name : ef ? " for the selected employee" : " for every employee"}. Tasks already
                  alerted in the last 10 minutes are skipped.
                </p>
              </Modal>
            )}

            <div className="fixed bottom-5 right-5 z-50 space-y-2 w-72">
              {toasts.map((t) => (
                <div
                  key={t.id}
                  className={"pop px-4 py-3 rounded-xl shadow-xl text-sm font-medium " + (t.e ? "bg-rose-600 text-white" : "toast")}
                >
                  {t.m}
                </div>
              ))}
            </div>
          </Toast.Provider>
        );
      }

      function Root() {
        const [u, setU] = useState(null);
        useEffect(() => {
          const h = () => setU(null);
          window.addEventListener("tm-session-expired", h);
          return () => window.removeEventListener("tm-session-expired", h);
        }, []);
        const [theme, setTheme] = useState(
          () => document.documentElement.getAttribute("data-theme") || "light",
        );
        useEffect(() => {
          document.documentElement.setAttribute("data-theme", theme);
          try {
            localStorage.setItem("tm-theme", theme);
          } catch (e) {}
        }, [theme]);
        const ctx = useMemo(
          () => ({ theme, toggle: () => setTheme((t) => (t === "dark" ? "light" : "dark")) }),
          [theme],
        );
        return (
          <ThemeCtx.Provider value={ctx}>
            <Scene theme={theme} />
            {u ? (
              <Main
                u={u}
                out={() => {
                  /* save the logout time on the server; wait up to 2.5 s so the write is not cut off */
                  const call = api("markLogout", u.token).catch(() => {});
                  Promise.race([call, new Promise((r) => setTimeout(r, 2500))]).finally(() => setU(null));
                }}
              />
            ) : (
              <Login onLogin={setU} />
            )}
          </ThemeCtx.Provider>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
    </script>
  </body>
</html>
