<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Employee Task Management System</title>
    <script>
      /* set theme before first paint so there is no flash */
      try {
        var _t = localStorage.getItem("tm-theme");
        if (_t) document.documentElement.setAttribute("data-theme", _t);
      } catch (e) {}
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
      /* ================= THEME TOKENS =================
         light = bright day over the plant (blue sky, white towers, steel-blue scaffolds)
         dark  = the same plant at night (navy sky, cyan holographic glow)            */
      :root,
      [data-theme="light"] {
        color-scheme: light;
        --bg: #cfe6fb;
        --text: #0a2342;
        --text2: #27456b;
        --mute: #5a7391;
        --glass: linear-gradient(145deg, rgba(255, 255, 255, 0.88), rgba(232, 244, 255, 0.7));
        --glass-bd: rgba(37, 99, 235, 0.22);
        --shadow: 0 12px 36px rgba(30, 64, 175, 0.16), 0 2px 6px rgba(30, 64, 175, 0.08);
        --line: rgba(37, 99, 235, 0.14);
        --rowline: rgba(37, 99, 235, 0.09);
        --soft: rgba(37, 99, 235, 0.06);
        --soft2: rgba(37, 99, 235, 0.12);
        --input-bg: rgba(255, 255, 255, 0.95);
        --input-bd: rgba(37, 99, 235, 0.3);
        --accent: #2563eb;
        --accent2: #06b6d4;
        --warm: #ff8a1f;
        --accent-soft: rgba(37, 99, 235, 0.24);
        --grad: linear-gradient(135deg, #2f7bff, #0ea5e9);
        --grad-bar: linear-gradient(90deg, #22d3ee, #2563eb);
        --grad-warm: linear-gradient(135deg, #ffb020, #ff6a1a);
        --modal: rgba(255, 255, 255, 0.985);
        --head: rgba(255, 255, 255, 0.82);
        --nav: rgba(255, 255, 255, 0.6);
        --rose: #e11d48;
        --teal: #047857;
        --amber: #b45309;
        --link: #1d4ed8;
        --over: rgba(225, 29, 72, 0.09);
        --unread: rgba(37, 99, 235, 0.09);
        --grp: linear-gradient(90deg, #e0edff, #f1f7ff);
        --grp-today: linear-gradient(90deg, #ffe3bf, #fff1de);
        --ghost-bd: rgba(37, 99, 235, 0.3);
        --scroll: #93b4e6;
        --pre: rgba(10, 35, 66, 0.08);
        --toast: #0a2342;
        --scrim: rgba(8, 24, 56, 0.5);
      }
      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #061427;
        --text: #eaf4ff;
        --text2: #bcd3f2;
        --mute: #8aa6c8;
        --glass: linear-gradient(145deg, rgba(16, 34, 66, 0.74), rgba(8, 20, 42, 0.6));
        --glass-bd: rgba(110, 180, 255, 0.2);
        --shadow: 0 12px 44px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --line: rgba(130, 190, 255, 0.14);
        --rowline: rgba(130, 190, 255, 0.08);
        --soft: rgba(110, 170, 255, 0.07);
        --soft2: rgba(110, 170, 255, 0.14);
        --input-bg: rgba(110, 170, 255, 0.08);
        --input-bd: rgba(130, 190, 255, 0.22);
        --accent: #38bdf8;
        --accent2: #22d3ee;
        --warm: #ffb347;
        --accent-soft: rgba(56, 189, 248, 0.26);
        --grad: linear-gradient(135deg, #2dd4ff, #4f7cff);
        --grad-bar: linear-gradient(90deg, #22d3ee, #6d8dff);
        --grad-warm: linear-gradient(135deg, #ffc24a, #ff7a2e);
        --modal: rgba(8, 18, 38, 0.985);
        --head: rgba(6, 16, 34, 0.78);
        --nav: rgba(6, 16, 34, 0.55);
        --rose: #ff7a90;
        --teal: #34e3b5;
        --amber: #ffc15a;
        --link: #7dd3fc;
        --over: rgba(255, 90, 120, 0.11);
        --unread: rgba(56, 189, 248, 0.13);
        --grp: linear-gradient(90deg, #0c1d38, #142a4d);
        --grp-today: linear-gradient(90deg, #3a2812, #1f2f55);
        --ghost-bd: rgba(130, 190, 255, 0.26);
        --scroll: #2d4f7c;
        --pre: rgba(0, 0, 0, 0.42);
        --toast: #10264a;
        --scrim: rgba(2, 8, 20, 0.72);
      }
      html,
      body {
        background: var(--bg);
      }
      body {
        color: var(--text);
        font-family: Inter, sans-serif;
        transition: color 0.3s;
      }
      .font-display {
        font-family: Sora, sans-serif;
      }
      .glass {
        background: var(--glass);
        backdrop-filter: blur(14px) saturate(1.25);
        -webkit-backdrop-filter: blur(14px) saturate(1.25);
        border: 1px solid var(--glass-bd);
        border-radius: 18px;
        box-shadow: var(--shadow);
        transition:
          background 0.3s,
          border-color 0.3s;
      }
      .tilt {
        transition: transform 0.15s ease-out;
      }
      input,
      select,
      textarea {
        background: var(--input-bg);
        border: 1px solid var(--input-bd);
        border-radius: 10px;
        padding: 8px 12px;
        color: var(--text);
        font-size: 13px;
        outline: none;
        max-width: 100%;
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--mute);
        opacity: 0.8;
      }
      select option {
        color: var(--text);
        background: var(--modal);
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .btn {
        background: var(--grad);
        border-radius: 10px;
        padding: 8px 14px;
        font-weight: 700;
        font-size: 13px;
        color: #fff;
        box-shadow: 0 6px 18px var(--accent-soft), inset 0 1px 0 rgba(255, 255, 255, 0.28);
        transition:
          transform 0.12s,
          filter 0.12s;
      }
      .btn:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }
      .btn:active {
        transform: scale(0.95);
      }
      .btn:disabled {
        opacity: 0.5;
      }
      .btn-danger {
        background: #d1303f !important;
        box-shadow: none;
      }
      .ghost {
        border: 1px solid var(--ghost-bd);
        border-radius: 10px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text2);
        transition: background 0.15s;
      }
      .ghost:hover {
        background: var(--soft2);
      }
      /* colour helpers (theme aware) */
      .mute { color: var(--mute); }
      .sub { color: var(--text2); }
      .c-rose { color: var(--rose); }
      .c-teal { color: var(--teal); }
      .c-amber { color: var(--amber); }
      .c-link { color: var(--link); }
      .soft { background: var(--soft); }
      .soft2 { background: var(--soft2); }
      .bd { border: 1px solid var(--line); }
      .bdt { border-top: 1px solid var(--line); }
      .bdb { border-bottom: 1px solid var(--line); }
      .rowt { border-top: 1px solid var(--rowline); }
      .hov:hover { background: var(--soft); }
      .rowover { background: var(--over); }
      .bgrose { background: var(--over); }
      .bgteal { background: rgba(16, 185, 129, 0.13); }
      .unread { background: var(--unread); }
      .pre { background: var(--pre); color: var(--text2); }
      .toast { background: var(--toast); color: #fff; border: 1px solid var(--glass-bd); }
      .hdr { background: var(--head); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
      .navb { background: var(--nav); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
      .card {
        background: var(--soft);
        border: 1px solid var(--line);
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .card:hover { border-color: var(--accent); }
      .card.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .sel { box-shadow: 0 0 0 2px var(--accent); }
      .pri-High { color: var(--rose); background: rgba(244, 63, 94, 0.14); }
      .pri-Medium { color: var(--amber); background: rgba(255, 171, 46, 0.18); }
      .pri-Low { color: var(--teal); background: rgba(16, 185, 129, 0.15); }
      .tab { color: var(--mute); border-bottom: 2px solid transparent; }
      .tab:hover { color: var(--text); }
      .tab-on {
        color: var(--text);
        border-bottom-color: transparent;
        background-image: linear-gradient(90deg, var(--accent2), var(--accent));
        background-size: 100% 3px;
        background-repeat: no-repeat;
        background-position: 0 100%;
        text-shadow: 0 0 14px var(--accent-soft);
      }
      .seg-on { background: var(--accent); color: #fff; }
      .seg-off { color: var(--text2); }
      .btn-warm {
        background: var(--grad-warm);
        box-shadow: 0 6px 18px rgba(255, 138, 31, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }
      .grad-text {
        background: linear-gradient(90deg, var(--text) 8%, var(--accent) 58%, var(--accent2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      ::selection { background: var(--accent-soft); }
      .hazard {
        height: 5px;
        background: repeating-linear-gradient(-45deg, #ffb020 0 10px, #0b1f3d 10px 20px);
      }
      @keyframes up { from { opacity: 0; transform: translateY(16px); } }
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .up { animation: up 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
      @keyframes grow { from { transform: scaleX(0); } }
      .grow { transform-origin: left; animation: grow 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }
      @keyframes ring {
        0%, 100% { transform: rotate(0); }
        20%, 60% { transform: rotate(-14deg); }
        40%, 80% { transform: rotate(14deg); }
      }
      .ring { animation: ring 0.6s; }
      @keyframes pop { from { transform: scale(0.6); opacity: 0; } }
      .pop { animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      th {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--mute);
        text-align: left;
        padding: 10px 12px;
        font-weight: 700;
      }
      td { padding: 10px 12px; vertical-align: top; font-size: 13px; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 8px; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo, useCallback, useContext, createContext } =
        React;

      /* ============ API ============
         Real mode: google.script.run (Apps Script).
         Outside Apps Script (opening this file directly) a small demo backend answers,
         so you can preview both themes. Any username/password works in demo mode. */
      const demo = (() => {
        const dstr = (n) => {
          const x = new Date();
          x.setDate(x.getDate() + n);
          return (
            String(x.getDate()).padStart(2, "0") +
            "/" +
            String(x.getMonth() + 1).padStart(2, "0") +
            "/" +
            x.getFullYear()
          );
        };
        const people = [
          ["a", "Aarav"],
          ["m", "Meera"],
          ["k", "Kabir"],
          ["i", "Ishita"],
          ["r", "Rohan"],
          ["s", "Sonu"],
        ].map(([key, name]) => ({ key, name }));
        const titles = [
          "Container documents check",
          "Vessel discharge plan, berth 2",
          "Tank T-102 level and sample check",
          "Customs BoE filing for import cargo",
          "Tanker loading schedule review",
          "Solvent batch QC report",
          "Pipeline pressure test log",
          "Hot work permit renewal (PTW)",
        ];
        const descs = [
          "Verify BL, invoice and packing list against the container list.",
          "Confirm pumping sequence and shore tank allocation with the master.",
          "Record dip level, take composite sample and send to the lab.",
          "Prepare and file the bill of entry, attach duty receipts.",
          "Check draft survey, compartments and dispatch timings.",
          "Compile density, flash point and purity results for the batch.",
          "Log hold-time readings for line 3 and flag any pressure drop.",
          "Renew permit, confirm gas test and fire watch before work starts.",
        ];
        const stat = ["Pending", "In Progress", "Done", "Pending", "In Progress", "Done"];
        const pri = ["High", "Medium", "Low"];
        const tasks = [];
        for (let i = 0; i < 18; i++) {
          const o = people[i % 5];
          tasks.push({
            OwnerKey: o.key,
            Owner: o.name,
            rowNumber: 7 + i,
            TaskName: titles[i % titles.length],
            Description: descs[i % descs.length],
            AssignedTo: o.name,
            Timestamp: dstr(-(i % 6) - (i % 7 === 0 ? 45 : 0)) + " 10:00",
            TimestampRaw: Date.now() - (i % 6) * 864e5,
            Deadline: dstr((i % 8) - 3),
            Priority: pri[i % 3],
            Status: stat[i % 6],
            WorkProgress: [0, 40, 100, 10, 65, 100][i % 6],
            Remark: i % 4 === 0 ? "Waiting on documents" : "",
            LastUpdate: dstr(-(i % 12)),
            FollowUp: i % 5 === 0 ? dstr((i % 3) - 1) : "",
            Notes: i % 4 === 0 ? dstr(-3) + ": Called the party, they will confirm next week" : "",
          });
        }
        const chat = [];
        const recs = [
          { id: "R1", taskName: "All party account tally", personKey: people[1].key, assignedTo: "", description: "Month-end tally with every party", priority: "High", repeat: "Monthly", day: "4", startDate: "2026-01-01", endDate: "", dueInDays: 2, reminder: { before: [1], onDay: true, overdueDays: 2, times: ["09:00", "16:00"], notifyAdmin: true }, active: true, lastCreated: "" },
          { id: "R2", taskName: "Weekly sales report", personKey: people[0].key, assignedTo: "", description: "", priority: "Medium", repeat: "Weekly", day: "Mon", startDate: "2026-01-01", endDate: "", dueInDays: 1, reminder: null, active: true, lastCreated: "" },
          { id: "R3", taskName: "Insurance renewal", personKey: people[2].key, assignedTo: "", description: "", priority: "High", repeat: "Yearly", day: "03-15", startDate: "2026-01-01", endDate: "", dueInDays: 15, reminder: null, active: false, lastCreated: "" },
        ];
        const recNext = (r, n) => {
          const out = [];
          let d = new Date();
          for (let i = 0; i < 800 && out.length < n; i++, d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) {
            const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
            if (k < r.startDate || (r.endDate && k > r.endDate)) continue;
            const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
            let ok = false;
            if (r.repeat === "Daily") ok = true;
            else if (r.repeat === "Weekdays") ok = d.getDay() !== 0;
            else if (r.repeat === "Weekly") ok = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][d.getDay()] === r.day;
            else if (r.repeat === "Monthly") ok = d.getDate() === (r.day === "Last" ? dim : Math.min(+r.day, dim));
            else if (r.repeat === "Yearly") { const m = r.day.split("-"); ok = d.getMonth() + 1 === +m[0] && d.getDate() === Math.min(+m[1], new Date(d.getFullYear(), +m[0], 0).getDate()); }
            if (ok) out.push(k);
          }
          return out;
        };
        const notes = [
          { id: "n1", title: "New task assigned", message: "Container documents check", timestamp: dstr(0) + " 09:10", read: false },
          { id: "n2", title: "Due soon", message: "Vessel inspection report is due tomorrow", timestamp: dstr(0) + " 08:30", read: true },
        ];
        const pending = () =>
          tasks
            .filter((t) => t.Status !== "Done")
            .slice(0, 6)
            .map((t) => ({
              task: t.TaskName,
              assignedDate: t.Timestamp,
              dueDate: t.Deadline,
              priority: t.Priority,
              status: t.Status,
              sheetLabel: "Checklist",
              owner: t.Owner,
              sheetUrl: "#checklist",
              spreadsheetId: "demo",
              tabName: "Tab",
              rowIndex: t.rowNumber,
              statusCol: 5,
              isOverdue: (() => {
                const m = t.Deadline.match(/^(\d+)\/(\d+)\/(\d+)/);
                const d = new Date(+m[3], m[2] - 1, +m[1]);
                const n = new Date();
                n.setHours(0, 0, 0, 0);
                return d < n;
              })(),
            }));
        const sheets = [
          { label: "Daily Checklist", url: "#checklist", owner: "Demo" },
          { label: "FMS Cargo", url: "#fms", owner: "Demo" },
        ];

        /* ---- demo attendance data (made-up punch times, only for previewing this file) ---- */
        const dpad = (n) => String(n).padStart(2, "0");
        const dk = (d) => d.getFullYear() + "-" + dpad(d.getMonth() + 1) + "-" + dpad(d.getDate());
        const dparse = (s) => {
          const p = String(s).split("-").map(Number);
          return new Date(p[0], p[1] - 1, p[2]);
        };
        const dhash = (s) => {
          let h = 0;
          for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0;
          return Math.abs(h);
        };
        const dpunch = (name, key) => {
          const dow = dparse(key).getDay();
          const h = dhash(name + key);
          if (dow === 0 || h % 7 === 0) return null;
          const mins = 8 * 60 + 45 + (h % 50);
          const hh = Math.floor(mins / 60),
            mm = mins % 60;
          return dpad(hh % 12 || 12) + ":" + dpad(mm) + " " + (hh >= 12 ? "PM" : "AM");
        };
        const DAYN = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        const nowD = new Date();
        const dHol = [{ date: dk(new Date(nowD.getFullYear(), nowD.getMonth(), 20)), title: "Diwali" }];
        const dLeave = [{ name: "Kabir", date: dk(new Date(nowD.getFullYear(), nowD.getMonth(), 8)) }];
        const sonuOff = (name, key) => {
          const dt = dparse(key);
          return name === "Sonu" && dt.getDay() === 6 && [2, 4].includes(Math.ceil(dt.getDate() / 7));
        };
        const demoMonth = (monthStr, personName) => {
          const nowKey = dk(new Date());
          if (!monthStr) monthStr = nowKey.substring(0, 7);
          const y = +monthStr.split("-")[0],
            mo = +monthStr.split("-")[1];
          const dim = new Date(y, mo, 0).getDate();
          const names = personName ? [personName] : people.map((p) => p.name);
          return {
            month: monthStr,
            daysInMonth: dim,
            people: names.map((name) => {
              let pr = 0,
                ab = 0,
                off = 0,
                hl = 0,
                lv = 0;
              const days = [];
              for (let d = 1; d <= dim; d++) {
                const key = monthStr + "-" + dpad(d);
                const dow = new Date(y, mo - 1, d).getDay();
                const t = dpunch(name, key);
                const hol = dHol.find((h) => h.date === key);
                let status = "UPCOMING",
                  time = "";
                if (dLeave.some((l) => l.name === name && l.date === key)) {
                  status = "LEAVE";
                  lv++;
                } else if (t && !sonuOff(name, key)) {
                  status = "PRESENT";
                  time = t;
                  pr++;
                } else if (hol) {
                  status = "HOLIDAY";
                  hl++;
                } else if (dow === 0 || sonuOff(name, key)) {
                  status = "WEEKLY OFF";
                  off++;
                } else if (key > nowKey) status = "UPCOMING";
                else {
                  status = "ABSENT";
                  ab++;
                }
                days.push({ date: key, day: DAYN[dow], status, time, note: hol ? hol.title : "" });
              }
              return { name, presentDays: pr, absentDays: ab, weeklyOffDays: off, holidayDays: hl, leaveDays: lv, days };
            }),
            canManage: true,
            holidays: dHol.filter((h) => h.date.startsWith(monthStr)),
          };
        };
        const demoHistory = (from, to, personName) => {
          const names = personName ? [personName] : people.map((p) => p.name);
          const out = [];
          let d = dparse(to || dk(new Date()));
          const f = dparse(from || dk(new Date(Date.now() - 30 * 864e5)));
          let guard = 0;
          while (d >= f && guard++ < 120) {
            const key = dk(d);
            names.forEach((name) => {
              const t = dpunch(name, key);
              if (t)
                out.push({
                  date: key,
                  day: DAYN[d.getDay()],
                  time: t,
                  timestamp: dpad(d.getDate()) + "/" + dpad(d.getMonth() + 1) + "/" + d.getFullYear() + " " + t,
                  name,
                  status: "PRESENT",
                });
            });
            d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
          }
          return { from, to, person: personName || "All", count: out.length, records: out };
        };

        return (fn, a) => {
          switch (fn) {
            case "loginUser":
              return { success: true, token: "demo", role: "Admin", fullName: "Demo Admin", username: "demo", personKey: "a" };
            case "getPeopleList": return people;
            case "getAllTasks": return tasks.slice();
            case "getTasksByPerson": return tasks.filter((t) => t.OwnerKey === a[1]);
            case "getEmployeeLinks": {
              const pn = (people.find((q) => q.key === a[1]) || {}).name || "Demo";
              return { personKey: a[1], personalSheets: sheets.map((x) => ({ ...x, owner: pn })) };
            }
            case "getEmployeeFullData": {
              const pn = (people.find((q) => q.key === a[1]) || {}).name || "Demo";
              return { tasks: tasks.filter((t) => t.OwnerKey === a[1]), personalSheets: sheets.map((x) => ({ ...x, owner: pn })), pendingWork: pending() };

        const steamTex = softTex("rgba(255,255,255,.9)", "rgba(255,255,255,.35)");

        const G = new THREE.Group();
        sc.add(G);
        const lamps = [], railPos = [], plumes = [];
        const rnd = (a, b) => a + Math.random() * (b - a);
        const lamp = (x, y, z) => lamps.push(x, y, z);

        /* ---- builders ---- */
        function cyl(rt, rb, h, mat, x, y, z, seg, parent) {
          const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 24), mat);
          m.position.set(x, y, z);
          (parent || G).add(m);
          return m;
        }
        function dome(rad, mat, x, y, z, parent, sy) {
          const m = new THREE.Mesh(new THREE.SphereGeometry(rad, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), mat);
          m.position.set(x, y, z);
          m.scale.y = sy || 0.65;
          (parent || G).add(m);
          return m;
        }
        function band(rad, y, mat, parent) {
          const m = new THREE.Mesh(new THREE.TorusGeometry(rad * 1.006, 0.12, 8, 40), mat);
          m.rotation.x = Math.PI / 2;
          m.position.y = y;
          parent.add(m);
        }
        function platform(g, rad, y) {
          const R = rad + 1.3;
          const disc = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 0.14, 36), M.rail);
          disc.position.y = y;
          g.add(disc);
          const hr = new THREE.Mesh(new THREE.TorusGeometry(R, 0.06, 6, 36), M.rail);
          hr.rotation.x = Math.PI / 2;
          hr.position.y = y + 1.1;
          g.add(hr);
          for (let i = 0; i < 18; i++) {
            const a = (i / 18) * Math.PI * 2;
            const px = g.position.x + Math.cos(a) * R, pz = g.position.z + Math.sin(a) * R;
            railPos.push(px, y + 0.07, pz, px, y + 1.1, pz);
          }
          [0.3, 0.7].forEach((f) => {
            const a = Math.PI * f;
            lamp(g.position.x + Math.cos(a) * R, y + 1.5, g.position.z + Math.sin(a) * R);
          });
        }
        function column(x, z, h, rad, o) {
          o = o || {};
          const g = new THREE.Group();
          g.position.set(x, 0, z);
          const mat = o.white ? M.white : M.chrome;
          cyl(rad, rad * 1.03, h, mat, 0, h / 2, 0, 28, g);
          if (o.dome) dome(rad, mat, 0, h, 0, g, o.domeY || 0.65);
          else cyl(rad * 0.9, rad, 0.5, mat, 0, h + 0.25, 0, 28, g);
          const nb = o.bands != null ? o.bands : Math.floor(h / 7);
          for (let i = 1; i <= nb; i++) band(rad, (h * i) / (nb + 1), o.white ? M.chrome2 : M.chrome2, g);
          (o.plats || []).forEach((f) => platform(g, rad, h * f));
          const lad = new THREE.Mesh(new THREE.BoxGeometry(0.5, h * 0.96, 0.18), M.rail);
          lad.position.set(rad + 0.15, h * 0.48, rad * 0.2);
          g.add(lad);
          G.add(g);
          return g;
        }
        function pipe(pts, rad, mat) {
          const curve = new THREE.CatmullRomCurve3(
            pts.map((p) => new THREE.Vector3(p[0], p[1], p[2])), false, "catmullrom", 0.2,
          );
          G.add(new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(24, pts.length * 14), rad, 10, false), mat || M.chrome));
          const n = Math.max(2, Math.floor(curve.getLength() / 8));
          const fg = new THREE.TorusGeometry(rad * 1.18, rad * 0.3, 6, 14);
          for (let i = 1; i < n; i++) {
            const t = i / n, p = curve.getPointAt(t), tg = curve.getTangentAt(t);
            const f = new THREE.Mesh(fg, M.chrome2);
            f.position.copy(p);
            f.lookAt(p.clone().add(tg));
            G.add(f);
          }
          return curve;
        }
        function arch(x0, y0, z, x1, rise, rad) {
          pipe([[x0, y0, z], [x0, y0 + rise * 0.7, z], [(x0 + x1) / 2, y0 + rise, z], [x1, y0 + rise * 0.7, z], [x1, y0, z]], rad);
        }
        function hVessel(x, y, z, len, rad) {
          const g = new THREE.Group();
          g.position.set(x, y, z);
          const b = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, len, 28), M.chrome);
          b.rotation.z = Math.PI / 2;
          g.add(b);
          [-1, 1].forEach((s) => {
            const d = new THREE.Mesh(new THREE.SphereGeometry(rad, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), M.chrome);
            d.rotation.z = -s * Math.PI / 2;
            d.position.x = (s * len) / 2;
            d.scale.y = 0.7;
            g.add(d);
            const sd = new THREE.Mesh(new THREE.BoxGeometry(1.2, rad + 0.4, rad * 1.6), M.rail);
            sd.position.set(s * len * 0.32, -rad * 0.55, 0);
            g.add(sd);
            lamp(x + s * len * 0.3, y + rad * 0.2, z + rad);
          });
          G.add(g);
        }
        function sphereTank(x, z, rad) {
          const g = new THREE.Group();
          g.position.set(x, 0, z);
          const cy = rad + 2;
          const sp = new THREE.Mesh(new THREE.SphereGeometry(rad, 28, 20), M.chrome);
          sp.position.y = cy;
          g.add(sp);
          const eq = new THREE.Mesh(new THREE.TorusGeometry(rad * 1.005, 0.1, 6, 48), M.rail);
          eq.rotation.x = Math.PI / 2;
          eq.position.y = cy;
          g.add(eq);
          const lh = 0.4 * rad + 2;
          for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2;
            cyl(0.14, 0.14, lh, M.rail, Math.cos(a) * rad * 0.8, lh / 2, Math.sin(a) * rad * 0.8, 6, g);
          }
          lamp(x + rad * 0.8, cy + rad * 0.3, z + rad * 0.8);
          G.add(g);
        }
        function lattice(x, z, h, s) {
          const g = new THREE.Group();
          g.position.set(x, 0, z);
          const n = Math.max(4, Math.round(h / 4));
          [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach((a) => cyl(0.18, 0.18, h, M.steel, a[0] * s, h / 2, a[1] * s, 6, g));
          const bp = [];
          for (let i = 0; i <= n; i++) {
            const y = (h * i) / n;
            [s, -s].forEach((zz) => {
              const b = new THREE.Mesh(new THREE.BoxGeometry(s * 2, 0.14, 0.14), M.steel);
              b.position.set(0, y, zz);
              g.add(b);
            });
            [s, -s].forEach((xx) => {
              const b = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, s * 2), M.steel);
              b.position.set(xx, y, 0);
              g.add(b);
            });
            if (i % 2 === 0 && i > 0) {
              const dk = new THREE.Mesh(new THREE.BoxGeometry(s * 2 + 0.8, 0.12, s * 2 + 0.8), M.rail);
              dk.position.y = y;
              g.add(dk);
              lamp(x + s, y + 1.2, z + s);
              lamp(x - s, y + 1.2, z + s);
            }
            if (i < n) {
              const y1 = (h * (i + 1)) / n;
              bp.push(-s, y, s, s, y1, s, s, y, s, -s, y1, s, s, y, s, s, y1, -s, s, y, -s, s, y1, s);
            }
          }
          const bg = new THREE.BufferGeometry();
          bg.setAttribute("position", new THREE.Float32BufferAttribute(bp, 3));
          g.add(new THREE.LineSegments(bg, braceLine));
          G.add(g);
        }

        /* ---- the plant ---- */
        try {
          const gr = new THREE.Mesh(new THREE.PlaneGeometry(500, 300), M.ground);
          gr.rotation.x = -Math.PI / 2;
          gr.position.set(0, 0, -60);
          G.add(gr);

          /* far background, softened by fog */
          [[-60, -50, 40, 3], [-44, -56, 34, 2.6], [-18, -60, 44, 3.2], [24, -58, 40, 3], [52, -52, 36, 2.8], [66, -46, 30, 2.4]]
            .forEach((a) => column(a[0], a[1], a[2], a[3], { plats: [0.35, 0.6, 0.85] }));

          /* left: big domed reactor with candy-cane pipes, drums and mid columns */
          column(-24, -6, 38, 4.4, { dome: true, plats: [0.18, 0.34, 0.5, 0.66, 0.82], bands: 5 });
          arch(-21, 37, -6, -13, 8, 0.9);
          arch(-19, 40, -6, -11, 9, 0.8);
          column(-34, -14, 30, 3, { plats: [0.3, 0.55, 0.8] });
          column(-12, -10, 28, 2.4, { plats: [0.25, 0.5, 0.75] });
          column(-17, -2, 22, 1.8, { plats: [0.35, 0.7] });
          [[-40, 12, 1.8], [-36, 15, 2.1], [-31.5, 11, 2.0], [-27, 14, 1.8]].forEach((d, i) => {
            const g = column(d[0], 12, d[1], d[2], { dome: i % 2 === 0, bands: 3, plats: i === 1 ? [0.7] : [] });
            lamp(d[0] + 1.5, d[1] * 0.45, 12 + d[2]);
            lamp(d[0] - 1.2, d[1] * 0.2, 12 + d[2]);
          });
          hVessel(-14, 2.6, 14, 14, 2.3);

          /* centre: two white stacks in front of a perforated block */
          const blk = new THREE.Mesh(new THREE.BoxGeometry(10, 40, 8), M.block);
          blk.position.set(3.5, 20, -14);
          G.add(blk);
          column(-3, 2, 46, 1.7, { white: true, bands: 0, plats: [0.42, 0.58, 0.74, 0.9] });
          column(7, -2, 48, 1.7, { white: true, bands: 0, plats: [0.4, 0.55, 0.7, 0.88] });
          column(12, -6, 30, 3.3, { dome: true, plats: [0.3, 0.55, 0.8], bands: 3 });

          /* right: lattice towers, slender columns, orange riser, skid and sphere */
          lattice(24, -8, 34, 2.4);
          lattice(30, -10, 28, 2.0);
          column(42, -14, 34, 2.2, { plats: [0.3, 0.5, 0.7, 0.9] });
          column(48, -12, 26, 2.0, { plats: [0.35, 0.65] });
          pipe([[52, 0.5, -8], [52, 16, -8], [49, 22, -8]], 0.8, M.orange);
          const skid = new THREE.Mesh(new THREE.BoxGeometry(18, 5, 8), M.skid);
          skid.position.set(33, 2.5, 4);
          G.add(skid);
          hVessel(20, 2.4, 15, 12, 2.0);
          sphereTank(26, 10, 2.2);

          /* foreground pipe racks */
          pipe([[-46, 2.8, 10], [-30, 2.8, 10], [-28, 4.2, 8], [-10, 4.2, 8], [-8, 2.8, 10], [18, 2.8, 10], [22, 3.6, 9], [46, 3.6, 9]], 0.45);
          pipe([[-46, 5.2, 9], [-20, 5.2, 9], [-18, 6.6, 7], [12, 6.6, 7], [14, 5.2, 9], [46, 5.2, 9]], 0.35);
          pipe([[-44, 1.4, 12], [-26, 1.4, 12], [-24, 1.4, 16], [4, 1.4, 16], [6, 1.4, 12], [44, 1.4, 12]], 0.55);
          for (let x = -44; x <= 44; x += 5) {
            lamp(x + rnd(-1, 1), rnd(3, 5.8), 11);
            if (Math.random() < 0.5) lamp(x + rnd(-1, 1), rnd(10, 14), 4);
          }

          /* dense random pipework between structures */
          for (let k = 0; k < 18; k++) {
            const y = rnd(2.5, 22), z = rnd(-12, 12), x0 = rnd(-44, 20), len = rnd(18, 46), rad = rnd(0.28, 0.7), bend = rnd(-6, 8);
            pipe([[x0, y, z], [x0 + len * 0.4, y, z], [x0 + len * 0.4 + 2, y + bend * 0.4, z + rnd(-1, 1)], [x0 + len * 0.45 + 4, y + bend, z], [x0 + len, y + bend, z]], rad);
          }
          for (let k = 0; k < 8; k++) {
            const x = rnd(-40, 40), z = rnd(-8, 10), y1 = rnd(8, 26);
            pipe([[x, 0.4, z], [x, y1, z], [x + rnd(3, 8), y1 + 2, z]], rnd(0.25, 0.5));
          }

          /* steam wisps from the stack tops */
          [[-3, 47, 2], [7, 49, -2], [-24, 42, -6]].forEach((e) => {
            for (let k = 0; k < 4; k++) {
              const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: steamTex, color: 0x9cc6ff, transparent: true, depthWrite: false, fog: false, opacity: 0 }));
              sc.add(s);
              plumes.push({ s: s, x: e[0], y: e[1], z: e[2], life: k / 4, ph: Math.random() * 6 });
            }
          });

          /* rails + lamps + floating motes */
          const rg = new THREE.BufferGeometry();
          rg.setAttribute("position", new THREE.Float32BufferAttribute(railPos, 3));
          G.add(new THREE.LineSegments(rg, railLine));
          const lg = new THREE.BufferGeometry();
          lg.setAttribute("position", new THREE.Float32BufferAttribute(lamps, 3));
          G.add(new THREE.Points(lg, lampMat));
          G.add(new THREE.Points(lg, haloMat));
          const mp = new Float32Array(420 * 3);
          for (let i = 0; i < 420; i++) {
            mp[i * 3] = rnd(-55, 55);
            mp[i * 3 + 1] = rnd(0, 46);
            mp[i * 3 + 2] = rnd(-24, 18);
          }
          var mg = new THREE.BufferGeometry();
          mg.setAttribute("position", new THREE.BufferAttribute(mp, 3));
          G.add(new THREE.Points(mg, motesMat));
        } catch (err) {
          console.warn("Plant build stopped early:", err);
        }

        /* ---- environment reflections for the chrome ---- */
        let envRT = null;
        function buildEnv(P) {
          try {
            const pm = new THREE.PMREMGenerator(r);
            const es = new THREE.Scene();
            es.add(new THREE.Mesh(new THREE.SphereGeometry(60, 32, 16), new THREE.MeshBasicMaterial({ map: gradTex(P.env), side: THREE.BackSide, fog: false })));
            for (let i = 0; i < 14; i++) {
              const b = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 6), new THREE.MeshBasicMaterial({ color: P.envLamp }));
              const a = (i / 14) * Math.PI * 2;
              b.position.set(Math.cos(a) * 40, rnd(-14, -2), Math.sin(a) * 40);
              es.add(b);
            }
            const rt = pm.fromScene(es, 0.02);
            if (envRT) envRT.dispose();
            envRT = rt;
            sc.environment = rt.texture;
            pm.dispose();
          } catch (e) {
            console.warn("Environment map skipped:", e);
          }
        }

        function apply(th) {
          const P = PLANT_THEMES[th] || PLANT_THEMES.dark;
          if (sc.background && sc.background.dispose) sc.background.dispose();
          sc.background = gradTex(P.sky);
          sc.fog.color.setHex(P.fog);
          sc.fog.density = P.fogD;
          hemi.color.setHex(P.hemi[0]);
          hemi.groundColor.setHex(P.hemi[1]);
          hemi.intensity = P.hemi[2];
          key.color.setHex(P.key[0]);
          key.intensity = P.key[1];
          warmBase = P.warm;
          lampMat.opacity = P.lamp;
          motesMat.opacity = P.motes;
          haloMat.opacity = P.halo;
          M.chrome.color.setHex(P.chrome);
          M.chrome2.color.setHex(P.chrome2);
          M.white.color.setHex(P.white);
          M.ground.color.setHex(P.ground);
          Object.keys(M).forEach((k) => {
            M[k].envMapIntensity = P.envI;
          });
          plumeK = P.plume;
          plumes.forEach((p) => p.s.material.color.setHex(P.steam));
          buildEnv(P);
        }

        /* ---- animation ---- */
        let w = 0, pulse = 0, push = 0, mx = 0, my = 0, raf, baseZ = 56;
        const mm = (e) => {
          mx = e.clientX / window.innerWidth - 0.5;
          my = e.clientY / window.innerHeight - 0.5;
        };
        const bu = () => { pulse = 1; };
        const ts = () => { push = 1; };
        const rs = () => {
          const W = window.innerWidth, H = window.innerHeight;
          r.setSize(W, H, false);
          cam.aspect = W / H;
          cam.fov = cam.aspect < 1 ? 78 : 50;
          baseZ = cam.aspect < 1 ? 64 : 56;
          cam.updateProjectionMatrix();
        };
        rs();
        window.addEventListener("resize", rs);
        window.addEventListener("mousemove", mm);
        window.addEventListener("burst", bu);
        window.addEventListener("tabsw", ts);
        const tick = () => {
          w += 0.01 * calm;
          cam.position.x += (Math.sin(w * 0.5) * 5 + mx * 8 - cam.position.x) * 0.04;
          cam.position.y += (10 - my * 3 + Math.sin(w * 0.37) * 0.8 - cam.position.y) * 0.04;
          cam.position.z = baseZ - push * 6 + Math.sin(w * 0.3) * 1.5;
          cam.lookAt(-mx * 2, 19, -4);
          lampMat.size = 2.2 * (1 + 0.05 * Math.sin(w * 30)) + pulse * 1.4;
          haloMat.size = 9 * (1 + 0.04 * Math.sin(w * 22)) + pulse * 4;
          warm.forEach((l, i) => {
            l.intensity = warmBase * (1 + pulse * 0.9) * (0.96 + 0.04 * Math.sin(w * 20 + i));
          });
          plumes.forEach((p) => {
            p.life = (p.life + 0.003 * calm) % 1;
            const l = p.life, sz = 3 + l * 8;
            p.s.position.set(p.x + l * 4 + Math.sin(l * 6 + p.ph) * 0.8, p.y + l * 9, p.z);
            p.s.scale.set(sz, sz, 1);
            p.s.material.opacity = Math.sin(Math.PI * l) * 0.45 * plumeK;
          });
          if (typeof mg !== "undefined") {
            const a = mg.attributes.position.array;
            for (let i = 1; i < a.length; i += 3) {
              a[i] += 0.012 * calm;
              if (a[i] > 46) a[i] = 0;
            }
            mg.attributes.position.needsUpdate = true;
          }
          pulse *= 0.93;
          push *= 0.92;
          r.render(sc, cam);
          raf = requestAnimationFrame(tick);
        };
        tick();

        return {
          apply: apply,
          dispose: () => {
            cancelAnimationFrame(raf);
            window.removeEventListener("resize", rs);
            window.removeEventListener("mousemove", mm);
            window.removeEventListener("burst", bu);
            window.removeEventListener("tabsw", ts);
            r.dispose();
          },
        };
      }

      /* React wrapper: <PlantBackground theme="dark" /> or theme="light" */
      function PlantBackground({ theme }) {
        const ref = useRef(null),
          api = useRef(null);
        useEffect(() => {
          api.current = createPlantScene(ref.current);
          api.current.apply(theme);
          return () => api.current && api.current.dispose();
        }, []);
        useEffect(() => {
          api.current && api.current.apply(theme);
        }, [theme]);
        return (
          <canvas
            ref={ref}
            style={{ position: "fixed", inset: 0, width: "100%", height: "100%", pointerEvents: "none", zIndex: 0, display: "block" }}
          />
        );
      }

      const Scene = PlantBackground;

      /* ============ small UI helpers ============ */
      function ThemeBtn() {
        const { theme, toggle } = useContext(ThemeCtx);
        return (
          <button
            className="ghost"
            onClick={toggle}
            title="Switch light / dark"
            aria-label="Switch light or dark theme"
          >
            {theme === "dark" ? "☀️" : "🌙"}{" "}
            <span className="hidden sm:inline">{theme === "dark" ? "Light" : "Dark"}</span>
          </button>
        );
      }
      function useCount(n) {
        const [v, setV] = useState(0);
        useEffect(() => {
          let f;
          const s = performance.now();
          const t = (x) => {
            const p = Math.min(1, (x - s) / 700);
            setV(Math.round(n * (1 - Math.pow(1 - p, 3))));
            if (p < 1) f = requestAnimationFrame(t);
          };
          f = requestAnimationFrame(t);
          return () => cancelAnimationFrame(f);
        }, [n]);
        return v;
      }
      function Tilt({ children, className = "" }) {
        const r = useRef();
        const mv = (e) => {
          const b = r.current.getBoundingClientRect(),
            x = (e.clientX - b.left) / b.width - 0.5,
            y = (e.clientY - b.top) / b.height - 0.5;
          r.current.style.transform = `perspective(700px) rotateY(${x * 14}deg) rotateX(${-y * 14}deg) translateZ(6px)`;
        };
        return (
          <div
            ref={r}
            className={"tilt " + className}
            onMouseMove={mv}
            onMouseLeave={() => (r.current.style.transform = "")}
          >
            {children}
          </div>
        );
      }
      function Kpi({ label, value, color, sub, onClick, active }) {
        const n = useCount(value);
        return (
          <Tilt>
            <div onClick={onClick} className={"glass p-4 cursor-pointer up " + (active ? "sel" : "")} style={{ background: "linear-gradient(160deg," + color + "2b, transparent 62%), var(--glass)", borderTop: "3px solid " + color }}>
              <div
                className="w-2.5 h-2.5 rounded-full mb-2"
                style={{ background: color, boxShadow: "0 0 14px " + color }}
              />
              <div className="text-xs font-semibold mute">{label}</div>
              <div className="text-3xl font-extrabold font-display tabular-nums">{n}</div>
              <div className="text-[11px] mute">{sub}</div>
            </div>
          </Tilt>
        );
      }
      function Donut({ segs, total }) {
        const [hv, setHv] = useState(null);
        let off = 0;
        const C = 314.159;
        return (
          <div className="flex items-center gap-6">
            <svg viewBox="0 0 120 120" className="w-36 h-36 shrink-0">
              <g style={{ transform: "rotate(-90deg)", transformOrigin: "50% 50%" }}>
                <circle
                  cx="60"
                  cy="60"
                  r="50"
                  fill="none"
                  strokeWidth="14"
                  style={{ stroke: "var(--soft2)" }}
                />
                {segs.map((s) => {
                  const d = total ? (s.count / total) * C : 0,
                    o = off;
                  off += d;
                  return (
                    <circle
                      key={s.label}
                      cx="60"
                      cy="60"
                      r="50"
                      fill="none"
                      stroke={s.color}
                      strokeWidth={hv === s.label ? 20 : 14}
                      strokeDasharray={d + " " + (C - d)}
                      strokeDashoffset={-o}
                      style={{ transition: "all .5s" }}
                      onMouseEnter={() => setHv(s.label)}
                      onMouseLeave={() => setHv(null)}
                    />
                  );
                })}
              </g>
              <text
                x="60"
                y="60"
                textAnchor="middle"
                style={{ font: "800 20px Sora", fill: "var(--text)" }}
              >
                {hv ? segs.find((s) => s.label === hv).count : total}
              </text>
              <text x="60" y="74" textAnchor="middle" style={{ fontSize: 8, fill: "var(--mute)" }}>
                {hv || "tasks"}

      /* ============ LOGIN ============ */

          [ld, setLd] = useState(false);

            Notification.requestPermission();
          setLd(true);
          setErr("");
          api("loginUser", f.u, f.p)
            .then((r) => {
              setLd(false);
              if (!r.success) return setErr(r.message);
              burst();
              setTimeout(() => onLogin(r), 350);
            })
            .catch((e) => {
              setLd(false);
              setErr("Login failed: " + (e.message || e));
            });
        };

          <div className="relative z-10 min-h-screen flex items-center px-6 md:px-20">

      /* ============ PENDING WORK ============ */
      function PRow({ p, admin, u }) {
        const toast = useContext(Toast);
        const [st, setSt] = useState(p.status),
          [saved, setSaved] = useState(p.status),
          [sv, setSv] = useState(false);
        const save = (ns) => {
          if (!p.spreadsheetId || !p.tabName || !p.rowIndex || !p.statusCol)
            return toast('Could not write to sheet: "Status" column not found.', 1);
          setSv(true);
          api("updatePendingItemStatus", u.token, {
            spreadsheetId: p.spreadsheetId,
            tabName: p.tabName,
            rowIndex: p.rowIndex,
            statusCol: p.statusCol,
            actualCol: p.actualCol || null,
            newStatus: ns,
          })
            .then(() => {
              setSaved(ns);
              setSt(ns);
              if (ns === "Done" || ns === "Completed") burst();
              toast('Status updated to "' + ns + '"');
            })
            .catch((e) => toast("Update failed: " + (e.message || e), 1))
            .finally(() => setSv(false));
        };
        return (
          <tr className={"rowt " + (p.isOverdue ? "rowover" : "hov")}>
            <td className="font-semibold max-w-[220px]">
              {p.isOverdue && (
                <span className="mr-1.5 px-1.5 rounded text-[10px] font-bold bg-rose-500 text-white">
                  OVERDUE
                </span>
              )}
              {p.task}
            </td>
            <td className="font-mono text-xs mute">{p.assignedDate || "—"}</td>
            <td className="font-mono text-xs whitespace-nowrap">{p.dueDate || "—"}</td>

              <span className={"px-2 py-0.5 rounded-full text-[11px] font-bold " + (PRI[p.priority] || "")}>
                {p.priority || "—"}

              {admin ? (
                <div className="flex gap-1.5">
                  <select value={st} onChange={(e) => setSt(e.target.value)}>
                    {ST.map((s) => (
                      <option key={s}>{s}</option>

                  {st !== saved && (
                    <>
                      <button className="btn !px-2.5" disabled={sv} onClick={() => save(st)}>
                        {sv ? "…" : "✓"}
                      </button>
                      <button className="ghost" onClick={() => setSt(saved)}>

            <th>Assigned</th>

                  <button

            {dbg && (

            {loading && <p className="py-6 text-center text-sm mute">Scanning sheets…</p>}

                        </span>
                      </div>
                      <div className="overflow-x-auto">
                        <table className="w-full">
                          <thead>
                            <Head />
                          </thead>
                          <tbody>
                            {g.items.map((p, i) => (
                              <PRow key={g.k + i + p.task} p={p} admin={admin} u={u} />
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full">
                    <thead>
                      <Head />
                    </thead>
                    <tbody>
                      {items.map((p, i) => (
                        <PRow key={i + p.task} p={p} admin={admin} u={u} />
                      ))}
                    </tbody>

      function Sheets({ sheets, pend, admin, u, title }) {
        const [pv, setPv] = useState(null);

        return (

                    }

                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full">
                      <thead>
                        <tr>
                          <th>Task</th>
                          <th>Assigned</th>
                          <th>Due</th>
                          <th>Priority</th>
                          <th>Status</th>

                          {admin && <th />}

      }

      /* ============ ATTENDANCE: history + month view ============ */
      const pad2 = (n) => String(n).padStart(2, "0");
      const dkey = (d) => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
      const shiftMonth = (m, delta) => {
        const p = String(m).split("-").map(Number);
        const x = new Date(p[0], p[1] - 1 + delta, 1);
        return x.getFullYear() + "-" + pad2(x.getMonth() + 1);
      };
      const monthLabel = (m) => {
        const p = String(m).split("-").map(Number);
        return new Date(p[0], p[1] - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
      };
      const dmy = (k) => String(k).split("-").reverse().join("/");
      const downloadCsv = (rows, name) => {
        const csv = rows
          .map((r) => r.map((x) => '"' + String(x == null ? "" : x).replace(/"/g, '""') + '"').join(","))
          .join("\n");
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      };
      const AST = {
        PRESENT: { bg: "#10b981", fg: "#fff", l: "P" },
        ABSENT: { bg: "#f43f5e", fg: "#fff", l: "A" },
        "WEEKLY OFF": { bg: "var(--soft2)", fg: "var(--mute)", l: "O" },
        HOLIDAY: { bg: "#8b5cf6", fg: "#fff", l: "H" },
        LEAVE: { bg: "#ffab2e", fg: "#fff", l: "L" },
        UPCOMING: { bg: "transparent", fg: "var(--mute)", l: "·" },
      };
      const ALBL = { PRESENT: "Present", ABSENT: "Absent", "WEEKLY OFF": "Weekly off", HOLIDAY: "Holiday", LEAVE: "Leave" };
      const StatusPill = ({ s }) => {
        const c =
          s === "PRESENT"
            ? "bgteal c-teal"
            : s === "ABSENT"
              ? "bgrose c-rose"
              : s === "LEAVE"
                ? "pri-Medium"
                : s === "HOLIDAY"
                  ? ""
                  : "soft2 mute";
        return (
          <span
            className={"px-2 py-0.5 rounded-full text-[11px] font-bold " + c}
            style={s === "HOLIDAY" ? { color: "#8b5cf6", background: "rgba(139,92,246,.15)" } : null}
          >
            {s}
          </span>
        );
      };

      /* ============ HOLIDAYS & LEAVE (only the manager, Sonu, sees this) ============ */
      function HolidayLeavePanel({ people, mdata, act }) {
        const toast = useContext(Toast);
        const [h, setH] = useState({ date: "", title: "" });
        const [l, setL] = useState({ key: "", from: "", to: "" });
        const [busy, setBusy] = useState(false);
        const run = (fn, ...args) => {
          setBusy(true);
          return act(fn, ...args).finally(() => setBusy(false));
        };
        const addHol = () => {
          if (!h.date || !h.title.trim()) return toast("Pick a date and type the holiday name.", 1);
          run("markHoliday", h.date, h.title.trim()).then((r) => r && r.success !== false && setH({ date: "", title: "" }));
        };
        const addLeave = () => {
          const nm = (people.find((p) => p.key === l.key) || {}).name;
          if (!nm || !l.from) return toast("Choose the employee and the leave date.", 1);
          if (l.to && l.to < l.from) return toast("'To' date must be on or after the 'From' date.", 1);
          run("markLeave", nm, l.from, l.to || l.from).then((r) => r && r.success !== false && setL({ ...l, from: "", to: "" }));
        };
        return (
          <section className="glass p-4 space-y-4">
            <div className="flex flex-wrap justify-between items-center gap-2">
              <h2 className="font-display font-bold text-sm">🗓️ Holidays &amp; leave</h2>
              <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full soft2 mute">Only you can edit these</span>
            </div>
            <div className="grid md:grid-cols-2 gap-4">
              <div className="rounded-xl bd soft p-3 space-y-2">
                <div className="text-xs font-bold">Mark a holiday (for everyone)</div>
                <div className="flex flex-wrap gap-2">
                  <input type="date" value={h.date} onChange={(e) => setH({ ...h, date: e.target.value })} />
                  <input
                    className="flex-1 min-w-[140px]"
                    value={h.title}
                    onChange={(e) => setH({ ...h, title: e.target.value })}
                    placeholder="e.g. Diwali"
                  />
                  <button className="btn" disabled={busy} onClick={addHol}>
                    Add holiday
                  </button>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {(mdata.holidays || []).map((x) => (
                    <span key={x.date} className="px-2 py-1 rounded-lg text-[11px] font-semibold flex items-center gap-1.5" style={{ color: "#8b5cf6", background: "rgba(139,92,246,.14)" }}>
                      {dmy(x.date)} · {x.title}
                      <button title="Remove this holiday" className="font-bold" disabled={busy} onClick={() => run("removeHoliday", x.date)}>
                        ✕
                      </button>
                    </span>
                  ))}
                  {!(mdata.holidays || []).length && <span className="text-[11px] mute">No holidays in this month.</span>}
                </div>
              </div>
              <div className="rounded-xl bd soft p-3 space-y-2">
                <div className="text-xs font-bold">Mark leave (one day or a range)</div>
                <div className="flex flex-wrap gap-2 items-center">
                  <select value={l.key} onChange={(e) => setL({ ...l, key: e.target.value })}>
                    <option value="">Employee</option>
                    {people.map((p) => (
                      <option key={p.key} value={p.key}>
                        {p.name}
                      </option>
                    ))}
                  </select>
                  <input type="date" value={l.from} onChange={(e) => setL({ ...l, from: e.target.value })} title="From" />
                  <input type="date" value={l.to} onChange={(e) => setL({ ...l, to: e.target.value })} title="To (optional)" />
                  <button className="btn" disabled={busy} onClick={addLeave}>
                    Mark leave
                  </button>
                </div>
                <p className="text-[11px] mute">
                  Leave the "To" date empty for a single day. Weekly offs and holidays inside the range are skipped, and a day
                  where the person already punched in is not changed.
                </p>
              </div>
            </div>
          </section>
        );
      }

      function AttendanceView({ u, admin, people }) {
        const toast = useContext(Toast);
        const today = new Date();
        const thisMonth = today.getFullYear() + "-" + pad2(today.getMonth() + 1);
        const [mode, setMode] = useState("month"),
          [month, setMonth] = useState(thisMonth),
          [person, setPerson] = useState(""),
          [from, setFrom] = useState(dkey(new Date(today.getFullYear(), today.getMonth(), 1))),
          [to, setTo] = useState(dkey(today)),
          [mdata, setMdata] = useState(null),
          [hdata, setHdata] = useState(null),
          [ld, setLd] = useState(false);
        const pname = person ? (people.find((p) => p.key === person) || {}).name || "" : "";

        const loadMonth = () => {
          setLd(true);
          api("getMonthlyAttendance", u.token, month, pname)
            .then((r) => setMdata(r))
            .catch((e) => toast(e.message || String(e), 1))
            .finally(() => setLd(false));
        };
        const loadHist = () => {
          if (from > to) return toast("The 'From' date must be before the 'To' date.", 1);
          setLd(true);
          api("getAttendanceHistory", u.token, from, to, pname)
            .then((r) => setHdata(r))
            .catch((e) => toast(e.message || String(e), 1))
            .finally(() => setLd(false));
        };
        useEffect(() => {
          if (mode === "month") loadMonth();
          else loadHist();
        }, [mode, month, person]);
        const canM = !!(mdata && mdata.canManage);
        const act = (fn, ...args) =>
          api(fn, u.token, ...args)
            .then((r) => {
              toast((r && r.message) || "Done.", !!r && r.success === false);
              if (!r || r.success !== false) loadMonth();
              return r;
            })
            .catch((e) => {
              toast(e.message || String(e), 1);
              return null;
            });

        const ps = (mdata && mdata.people) || [];
        const recs = (hdata && hdata.records) || [];
        const dayNums = ps.length ? ps[0].days.map((d) => Number(d.date.slice(8))) : [];

        const exportCsv = () => {
          if (mode === "month") {
            const rows = [["Name", "Date", "Day", "Status", "Punch time", "Logout time", "Note"]];
            ps.forEach((p) =>
              p.days.forEach((d) => rows.push([p.name, dmy(d.date), d.day, d.status, d.time, d.logout || "", d.note || ""])),
            );
            downloadCsv(rows, "attendance-" + month + ".csv");
          } else {
            const rows = [["Date", "Day", "Name", "Punch time", "Logout time", "Status"]];
            recs.forEach((r) => rows.push([dmy(r.date), r.day, r.name, r.time, r.logout || "", r.status]));
            downloadCsv(rows, "attendance-" + from + "-to-" + to + ".csv");
          }
        };

        return (
          <div className="space-y-5">
            <div className="flex flex-wrap justify-between items-end gap-3">
              <div>
                <h1 className="font-display font-extrabold text-2xl">Attendance</h1>
                <p className="text-sm sub">
                  {admin
                    ? "Punch-in history and a full month view for your team."
                    : "Your punch-in history and your month at a glance."}
                </p>
              </div>
              <div className="flex rounded-lg overflow-hidden" style={{ border: "1px solid var(--ghost-bd)" }}>
                {[
                  ["month", "Month view"],
                  ["history", "History"],
                ].map(([k, l]) => (
                  <button
                    key={k}
                    onClick={() => setMode(k)}

                {ps.length > 1 && (
                  <section className="glass overflow-x-auto">
                    <table className="w-full" style={{ minWidth: 900 }}>
                      <thead>
                        <tr>
                          <th>Employee</th>

                            <th key={n} style={{ padding: "10px 2px", textAlign: "center" }}>

                      </thead>
                      <tbody>
                        {ps.map((p) => (
                          <tr key={p.name} className="rowt hov">
                            <td

            {/* ---------- HISTORY VIEW ---------- */}
            {!ld && mode === "history" && hdata && (

      }

      /* ============ MIS SCORE (Delegation / Checklist style) ============ */
      const misRange = (k) => {
        const t = new Date(),
          dow = (t.getDay() + 6) % 7;
        const mon = new Date(t.getFullYear(), t.getMonth(), t.getDate() - dow);
        if (k === "week") return [dkey(mon), dkey(t)];
        if (k === "lastweek")
          return [
            dkey(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() - 7)),
            dkey(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() - 1)),
          ];
        if (k === "lastmonth")
          return [dkey(new Date(t.getFullYear(), t.getMonth() - 1, 1)), dkey(new Date(t.getFullYear(), t.getMonth(), 0))];
        return [dkey(new Date(t.getFullYear(), t.getMonth(), 1)), dkey(t)];
      };
      const misCls = (v) => (v >= -10 ? "c-teal" : v >= -40 ? "c-amber" : "c-rose");

      function MisView({ u, admin }) {
        const toast = useContext(Toast);
        const [preset, setPreset] = useState("month");
        const init = misRange("month");
        const [from, setFrom] = useState(init[0]),
          [to, setTo] = useState(init[1]),
          [data, setData] = useState(null),
          [ld, setLd] = useState(false),
          [open, setOpen] = useState(null),
          [type, setType] = useState("delegation");
        const load = (f, t, ty, force) => {
          if (f > t) return toast("The 'From' date must be before the 'To' date.", 1);
          setLd(true);
          api("getMisScores", u.token, f, t, "", ty || type, !!force)
            .then((r) => setData(r))
            .catch((e) => toast(e.message || String(e), 1))
            .finally(() => setLd(false));
        };
        const pickType = (ty) => {
          setType(ty);
          setOpen(null);
          load(from, to, ty);
        };
        useEffect(() => {
          load(from, to);
        }, []);
        const pick = (k) => {
          setPreset(k);
          if (k !== "custom") {
            const r = misRange(k);
            setFrom(r[0]);
            setTo(r[1]);
            load(r[0], r[1]);
          }
        };
        const rows = (data && data.rows) || [];
        const withData = rows.filter((r) => r.hasData);
        const best = withData[0],
          worst = withData[withData.length - 1];
        const isAll = !!(data && data.type === "all");
        const SRC = [
          ["delegation", "Delegation"],
          ["checklist", "Checklist"],
          ["fms", "FMS"],
        ];
        const exportCsv = () =>
          downloadCsv(
            [
              ["Rank", "Employee", "Planned", "Done on time", "Done late", "Not done", "% Work not done", "% Not done on time", "MIS score"].concat(
                isAll ? SRC.map(([k, l]) => l + " score") : [],
              ),
            ].concat(
              rows.map((r, i) =>
                [r.hasData ? i + 1 : "-", r.name, r.planned, r.doneOnTime, r.doneLate, r.notDone, r.pctNotDone, r.pctNotOnTime, r.score].concat(
                  isAll ? SRC.map(([k]) => (r.src && r.src[k] && r.src[k].hasData ? r.src[k].score : "")) : [],
                ),
              ),
            ),
            "mis-" + (data ? data.type : type) + "-" + from + "-to-" + to + ".csv",
          );
        const PRE = [
          ["week", "This week"],
          ["lastweek", "Last week"],
          ["month", "This month"],
          ["lastmonth", "Last month"],
          ["custom", "Custom"],
        ];
        return (
          <div className="space-y-5">
            <div>
              <h1 className="font-display font-extrabold text-2xl">MIS Score</h1>
              <p className="text-sm sub">
                {admin ? "Score for every employee." : "Your score."} Pick Delegation, Checklist, FMS or all together. 0 is perfect, the lower (more negative) the worse.
              </p>
            </div>
            <section className="glass p-4 flex flex-wrap gap-3 items-center">
              <div className="flex rounded-lg overflow-hidden" style={{ border: "1px solid var(--accent)" }}>
                {[...SRC, ["all", "Combined"]].map(([k, l]) => (
                  <button key={k} onClick={() => pickType(k)} className={"px-3.5 py-2 text-xs font-bold " + (type === k ? "seg-on" : "seg-off")}>
                    {l}
                  </button>
                ))}
              </div>
              <div className="flex rounded-lg overflow-hidden" style={{ border: "1px solid var(--ghost-bd)" }}>
                {PRE.map(([k, l]) => (
                  <button key={k} onClick={() => pick(k)} className={"px-3 py-2 text-xs font-semibold " + (preset === k ? "seg-on" : "seg-off")}>
                    {l}
                  </button>
                ))}
              </div>
              {preset === "custom" && (
                <>
                  <input type="date" value={from} onChange={(e) => setFrom(e.target.value)} />
                  <input type="date" value={to} onChange={(e) => setTo(e.target.value)} />
                  <button className="btn" disabled={ld} onClick={() => load(from, to)}>
                    Show
                  </button>
                </>
              )}
              <span className="text-xs font-mono mute">
                {dmy(from)} to {dmy(to)}
              </span>
              <div className="flex gap-2 ml-auto">
                <button className="ghost" disabled={!rows.length} onClick={exportCsv}>
                  ⬇ CSV
                </button>
                <button className="ghost" disabled={ld} onClick={() => load(from, to, type, true)}>
                  {ld ? "…" : "↻"} Refresh
                </button>
              </div>
            </section>

            {ld && (
              <div className="glass p-8 text-center text-sm mute animate-pulse">
                Calculating scores…{type !== "delegation" ? " Checklist and FMS sheets can take 10 to 30 seconds." : ""}
              </div>
            )}

            {!ld && data && data.skipped && data.skipped.length > 0 && (
              <div className="rounded-xl px-4 py-3 text-xs pri-Medium">
                <b>Some sheets could not be scored:</b> {data.skipped.join(" · ")}
              </div>
            )}

            {!ld && data && admin && withData.length > 1 && (
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                {[
                  ["Team average", data.avgScore, "#38bdf8", "average of everyone with tasks"],
                  ["Best score", best.score, "#10b981", best.name],
                  ["Needs attention", worst.score, "#f43f5e", worst.name],
                ].map(([l, v, c, sub]) => (
                  <div key={l} className="glass p-4 up" style={{ background: "linear-gradient(160deg," + c + "2b, transparent 62%), var(--glass)", borderTop: "3px solid " + c }}>
                    <div className="text-xs font-semibold mute">{l}</div>
                    <div className={"text-3xl font-extrabold font-display tabular-nums " + misCls(v)}>{v}</div>
                    <div className="text-[11px] mute">{sub}</div>
                  </div>
                ))}
              </div>
            )}

            {!ld && data && (
              <section className="glass overflow-x-auto">
                {!rows.length ? (
                  <p className="text-sm mute text-center py-10">No data for this period.</p>
                ) : (
                  <table className="w-full" style={{ minWidth: isAll ? 1000 : 820 }}>
                    <thead>
                      <tr>
                        <th>#</th>
                        <th>Employee</th>
                        <th>Planned</th>
                        <th>On time</th>
                        <th>Late</th>
                        <th>Not done</th>
                        <th>% Work not done</th>
                        <th>% Not on time</th>
                        <th>MIS score</th>
                        {isAll && SRC.map(([k, l]) => <th key={k}>{l}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {rows.map((r, i) => (
                        <React.Fragment key={r.key}>
                          <tr className={"rowt hov " + (r.items && r.items.length ? "cursor-pointer" : "")} onClick={() => r.items && r.items.length && setOpen(open === r.key ? null : r.key)}>
                            <td className="font-mono text-xs mute">{r.hasData ? i + 1 : "–"}</td>
                            <td className="font-semibold whitespace-nowrap">
                              {r.name}
                              {r.items && r.items.length > 0 && <span className="mute text-xs"> {open === r.key ? "▲" : "▼"}</span>}
                            </td>
                            <td className="font-mono">{r.planned}</td>
                            <td className="font-mono c-teal">{r.doneOnTime}</td>
                            <td className="font-mono c-amber">{r.doneLate}</td>
                            <td className="font-mono c-rose">{r.notDone}</td>
                            <td className="font-mono">{r.hasData ? r.pctNotDone + "%" : "—"}</td>
                            <td className="font-mono">{r.hasData ? r.pctNotOnTime + "%" : "—"}</td>
                            <td className={"font-mono font-extrabold text-base " + (r.hasData ? misCls(r.score) : "mute")}>{r.hasData ? r.score : "—"}</td>
                            {isAll &&
                              SRC.map(([k]) => {
                                const q = r.src && r.src[k];
                                return (
                                  <td key={k} className={"font-mono " + (q && q.hasData ? misCls(q.score) : "mute")} title={q ? q.planned + " planned" : ""}>
                                    {q && q.hasData ? q.score : "—"}
                                  </td>
                                );
                              })}
                          </tr>
                          {open === r.key && (
                            <tr className="rowt">
                              <td colSpan={isAll ? 12 : 9} style={{ background: "var(--soft)" }}>
                                <div className="text-xs font-bold mb-1.5">Tasks that cost points</div>
                                <div className="space-y-1">
                                  {r.items.map((x, j) => (
                                    <div key={j} className="flex flex-wrap gap-x-3 text-xs">
                                      <span className={"font-bold " + (x.kind === "Not done" ? "c-rose" : "c-amber")}>{x.kind}</span>
                                      <span className="font-semibold">{x.task || "(untitled)"}</span>
                                      {x.source && <span className="mute">[{x.source}]</span>}
                                      <span className="mute font-mono">
                                        due {dmy(x.deadline)}
                                        {x.doneDate ? " · done " + dmy(x.doneDate) : ""}
                                      </span>
                                    </div>
                                  ))}
                                </div>
                              </td>
                            </tr>
                          )}
                        </React.Fragment>
                      ))}
                    </tbody>
                  </table>
                )}
                <p className="text-[11px] mute px-4 pb-3 pt-1">
                  {{
                    delegation: "Delegation = the tasks in the Task Ledger.",
                    checklist: "Checklist = the personal sheets linked to each person (every sheet that is not an FMS sheet).",
                    fms: "FMS = personal sheets with FMS in their name. Every stage of a row counts, up to the first unfinished stage.",
                    all: "Combined = Delegation + Checklist + FMS added together. The last three columns show each score on its own.",
                  }[data.type] || ""}{" "}
                  Counted: items whose planned date or deadline is in this period and that are done or already overdue. Open items due
                  today or later are not counted yet. <b>% Work not done</b> = Not done ÷ Planned. <b>% Not on time</b> = (Late + Not
                  done) ÷ Planned. <b>MIS score</b> = −(% Work not done + % Not on time). Results are kept for 10 minutes; press Refresh to recalculate.{" "}
                </p>
              </section>
            )}
          </div>
        );
      }

      /* ============ TASKS: table + board ============ */
      /* ============ REPEAT TASKS (admin) ============ */
      const REP_DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const REP_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const repBlank = () => ({
        id: "", taskName: "", personKey: "", description: "", priority: "Medium", repeat: "Monthly",
        wDay: "Mon", mDay: "1", yMonth: 1, yDay: 1, startDate: "", endDate: "", dueInDays: 2, ...REM_DEFAULT,
      });
      const repDesc = (r) => {
        if (r.repeat === "Weekly") return "Every " + r.day;
        if (r.repeat === "Monthly") return r.day === "Last" ? "Monthly · last day" : "Monthly · day " + r.day;
        if (r.repeat === "Yearly") { const m = String(r.day).split("-"); return "Yearly · " + m[1] + " " + (REP_MONTHS[+m[0] - 1] || ""); }
        if (r.repeat === "Weekdays") return "Mon to Sat";
        return r.repeat;
      };
      const isoToDmy = (k) => (k ? k.split("-").reverse().join("/") : "");
      function RecurringView({ u, people }) {
        const toast = useContext(Toast);
        const [rules, setRules] = useState([]),
          [ld, setLd] = useState(false),
          [f, setF] = useState(null),
          [sub, setSub] = useState(false),
          [running, setRunning] = useState(false);
        const er = (e) => toast(e.message || String(e), 1);
        const load = () => {
          setLd(true);
          api("getRecurringRules", u.token)
            .then((r) => setRules(r || []))
            .catch(er)
            .finally(() => setLd(false));
        };
        useEffect(load, []);
        const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
        const openNew = () => setF({ ...repBlank(), personKey: people[0] ? people[0].key : "" });
        const openEdit = (r) => {
          const pl = r.reminder;
          let wDay = "Mon", mDay = "1", yMonth = 1, yDay = 1;
          if (r.repeat === "Weekly") wDay = r.day;
          if (r.repeat === "Monthly") mDay = r.day;
          if (r.repeat === "Yearly") { const m = String(r.day).split("-"); yMonth = +m[0]; yDay = +m[1]; }
          setF({
            ...repBlank(), id: r.id, taskName: r.taskName, personKey: r.personKey, description: r.description,
            priority: r.priority, repeat: r.repeat, wDay, mDay, yMonth, yDay, startDate: r.startDate, endDate: r.endDate,
            dueInDays: r.dueInDays,
            remOn: !!pl, before: pl ? pl.before : [], onDay: pl ? pl.onDay : false, overdueDays: pl ? pl.overdueDays : 0,
            times: pl ? pl.times : ["09:00"], notifyAdmin: pl ? pl.notifyAdmin : true,
          });
        };
        const save = () => {
          if (!f.taskName.trim()) return toast("Task name is required.", 1);
          if (!f.personKey) return toast("Pick the employee.", 1);
          if (!f.startDate) return toast("Pick a start date.", 1);
          if (f.remOn && !remCount(f)) return toast("Pick at least one reminder day, or turn WhatsApp reminders off.", 1);
          let day = "";
          if (f.repeat === "Weekly") day = f.wDay;
          if (f.repeat === "Monthly") day = f.mDay;
          if (f.repeat === "Yearly") day = pad2(f.yMonth) + "-" + pad2(f.yDay);
          setSub(true);
          api("saveRecurringRule", u.token, {
            id: f.id, taskName: f.taskName.trim(), personKey: f.personKey, description: f.description.trim(),
            priority: f.priority, repeat: f.repeat, day, startDate: f.startDate, endDate: f.endDate || "",
            dueInDays: +f.dueInDays || 0,
            reminder: { enabled: !!f.remOn, before: f.before, onDay: !!f.onDay, overdueDays: f.overdueDays, times: f.times, notifyAdmin: !!f.notifyAdmin },
          })
            .then((r) => { setF(null); toast(r.message || "Saved."); load(); })
            .catch(er)
            .finally(() => setSub(false));
        };
        const toggle = (r) =>
          api("setRecurringActive", u.token, r.id, !r.active).then((x) => { toast(x.message); load(); }).catch(er);
        const del = (r) => {
          if (!window.confirm('Delete the repeat rule "' + r.taskName + '"? Tasks already created stay.')) return;
          api("deleteRecurringRule", u.token, r.id).then((x) => { toast(x.message); load(); }).catch(er);
        };
        const runNow = () => {
          setRunning(true);
          api("runRecurringNow", u.token)
            .then((r) => { toast(r.message); load(); })
            .catch(er)
            .finally(() => setRunning(false));
        };
        return (
          <div className="space-y-5">
            <div className="flex flex-wrap justify-between items-end gap-3">

                <h1 className="font-display font-extrabold text-2xl">🔁 Repeat tasks</h1>
